name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Paket auf "public" setzen damit docker compose pull ohne Login funktioniert.
      # Voraussetzung: Secret GHCR_PAT mit einem PAT anlegen (Scope: write:packages + read:packages).
      # GitHub → Settings → Developer settings → Personal access tokens → Fine-grained oder Classic.
      - name: Make GHCR package public
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GHCR_PAT" ]; then
            echo "::warning::Secret GHCR_PAT fehlt — Paket bleibt privat. Anleitung: siehe Workflow-Kommentar."
            exit 0
          fi
          PACKAGE=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          HTTP=$(curl -s -o /tmp/gh_response.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $GHCR_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PACKAGE}" \
            -d '{"visibility":"public"}')
          echo "GitHub API → HTTP $HTTP"
          cat /tmp/gh_response.json
          [ "$HTTP" = "200" ] || { echo "::error::Sichtbarkeit konnte nicht auf public gesetzt werden (HTTP $HTTP)"; exit 1; }
          echo "Paket ist jetzt öffentlich erreichbar: ghcr.io/${IMAGE_NAME}:latest"
