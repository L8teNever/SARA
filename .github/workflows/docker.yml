name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GHCR_PAT (write:packages) wird bevorzugt; fällt auf GITHUB_TOKEN zurück wenn nicht gesetzt.
          # Bei 403-Fehler mit GITHUB_TOKEN: Settings → Actions → General → Workflow permissions → Read and write.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # HINWEIS: GitHub bietet aktuell keine öffentliche REST-API, um die Sichtbarkeit eines Packages
      # automatisch auf "public" zu setzen (daher der HTTP 404 Fehler). 
      # Dies muss einmalig manuell im GitHub Web-UI erfolgen:
      # 1. Gehe zu Deinem Profil -> "Packages" -> Wähle das Container-Package.
      # 2. Rechts unter "Package settings" -> "Danger Zone" -> "Change visibility" auf "Public" setzen.
      # Danach funktioniert 'docker compose pull' auf dem Server ohne vorheriges 'docker login'.
