version: "3.9"
# Produktion — Image wird automatisch von GitHub Container Registry gezogen
# Starten mit: docker compose pull && docker compose up -d

services:
  sara:
    image: ghcr.io/l8tenever/sara:latest
    container_name: sara-app
    restart: unless-stopped
    ports:
      - "7842:7842"
    environment:
      # Anthropic API Key — optional, nur fuer /api/generate-story (Prompt-Builder-Workflow braucht ihn nicht)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ElevenLabs API Key — optional, aktuell ungenutzt (TTS laeuft ueber lokales Kokoro-82M)
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # Optionaler Port-Override
      - PORT=7842
      # YouTube-Upload (optional) — siehe README, Abschnitt "YouTube-Upload einrichten"
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      # Persistente Daten: Videos, Datenbank, TTS-Temp
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('"http://localhost:7842/"')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
