version: "3.9"
# Lokaler Build (ohne GHCR) — für Entwicklung
# Starten mit: docker compose -f docker-compose.build.yml up -d --build

services:
  sara:
    build: .
    container_name: sara-app
    restart: unless-stopped
    ports:
      - "7842:7842"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - PORT=7842
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7842/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
