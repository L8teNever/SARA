version: "3.9"
# Lokaler Build (ohne GHCR) — für Entwicklung
# Starten mit: docker compose -f docker-compose.build.yml up -d --build

services:
  sara:
    build: .
    container_name: sara-app
    restart: unless-stopped
    ports:
      - "7842:7842"
    environment:
      - PORT=7842
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7842/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
