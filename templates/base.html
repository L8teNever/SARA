<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARA — Story And Reel Automator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      line-height: 1;
      user-select: none;
    }

    /* =====================================================
       Material Design 3 — Dark Theme Tokens
    ===================================================== */
    :root {
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-container: #EADDFF;
      --md-sys-color-secondary: #CCC2DC;
      --md-sys-color-on-secondary: #332D41;
      --md-sys-color-secondary-container: #4A4458;
      --md-sys-color-on-secondary-container: #E8DEF8;
      --md-sys-color-tertiary: #EFB8C8;
      --md-sys-color-on-tertiary: #492532;
      --md-sys-color-tertiary-container: #633B48;
      --md-sys-color-on-tertiary-container: #FFD8E4;
      --md-sys-color-surface: #141218;
      --md-sys-color-surface-container-low: #1D1B20;
      --md-sys-color-surface-container: #211F26;
      --md-sys-color-surface-container-high: #2B2930;
      --md-sys-color-surface-container-highest: #36343B;
      --md-sys-color-on-surface: #E6E1E5;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
      --md-sys-color-background: #141218;
      --md-sys-color-on-background: #E6E1E5;
      --md-sys-color-error: #F2B8B5;
      --md-sys-color-error-container: #8C1D18;
      --md-sys-color-success: #6DD58C;
      --md-sys-color-success-container: #0A3818;
      --md-sys-color-warning: #FFB951;
      --md-elevation-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
      --md-elevation-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
      --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
      --md-shape-small: 8px;
      --md-shape-medium: 12px;
      --md-shape-large: 16px;
      --md-shape-extra-large: 28px;
      --md-shape-full: 9999px;
      --nav-rail-w: 88px;
      --nav-drawer-w: 272px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Roboto Flex', sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      -webkit-font-smoothing: antialiased;
    }

    body { display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }

    /* =====================================================
       Top App Bar
    ===================================================== */
    .top-app-bar {
      position: relative;
      z-index: 100;
      background: var(--md-sys-color-surface-container-low);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      align-items: center;
      padding: 0 20px 0 20px;
      height: 64px;
      gap: 14px;
      flex-shrink: 0;
    }

    .top-app-bar__brand { display: flex; align-items: center; gap: 12px; }

    .top-app-bar__icon {
      width: 38px; height: 38px;
      background: var(--md-sys-color-primary-container);
      border-radius: var(--md-shape-medium);
      display: flex; align-items: center; justify-content: center;
      color: var(--md-sys-color-on-primary-container);
      font-size: 20px; font-weight: 800; letter-spacing: -1px;
      flex-shrink: 0;
    }

    .top-app-bar__titles { display: flex; flex-direction: column; }
    .top-app-bar__logo { font-size: 17px; font-weight: 700; color: var(--md-sys-color-on-surface); letter-spacing: 1.5px; line-height: 1.2; }
    .top-app-bar__sub { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
    .top-app-bar__spacer { flex: 1; }

    .queue-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-full);
      padding: 7px 16px;
      font-size: 13px; font-weight: 500;
    }

    .queue-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--md-sys-color-outline);
      transition: background .3s; flex-shrink: 0;
    }
    .queue-dot.active { background: var(--md-sys-color-primary); animation: pulse 1.5s infinite; }
    .queue-dot.error { background: var(--md-sys-color-error); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* =====================================================
       Layout
    ===================================================== */
    .layout-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 64px);
    }

    /* =====================================================
       Navigation Rail (≥1024px) / Drawer (≥1280px)
    ===================================================== */
    .nav-rail {
      display: none;
      width: var(--nav-rail-w);
      flex-shrink: 0;
      background: var(--md-sys-color-surface-container-low);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      height: 100%;
      overflow-y: auto;
      padding: 8px 0;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .nav-rail__label {
      display: none;
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--md-sys-color-on-surface-variant);
      padding: 12px 16px 4px;
      width: 100%;
    }

    .nav-divider {
      width: 48px; height: 1px;
      background: var(--md-sys-color-outline-variant);
      margin: 6px 0;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 0 8px; width: 76px;
      cursor: pointer; border: none; background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      font-family: inherit; font-size: 11px; font-weight: 500;
      transition: color .15s;
      border-radius: var(--md-shape-small);
    }

    .nav-item__pill {
      width: 56px; height: 32px;
      border-radius: var(--md-shape-full);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }

    .nav-item:hover .nav-item__pill { background: rgba(208,188,255,.08); }
    .nav-item.active { color: var(--md-sys-color-on-secondary-container); }
    .nav-item.active .nav-item__pill { background: var(--md-sys-color-secondary-container); }

    .nav-item .material-symbols-rounded { font-size: 22px; }
    .nav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .nav-item__lbl { font-size: 11px; text-align: center; line-height: 1.2; }

    @media (min-width: 1280px) {
      .nav-rail {
        width: var(--nav-drawer-w);
        align-items: stretch;
        padding: 8px 12px;
      }
      .nav-rail__label { display: block; }
      .nav-divider { width: auto; margin: 4px 0; }

      .nav-item {
        flex-direction: row; gap: 14px;
        width: auto; height: 52px;
        padding: 0 14px;
        border-radius: var(--md-shape-full);
        font-size: 14px; position: relative;
      }

      .nav-item__pill {
        position: absolute; inset: 0;
        width: auto; height: auto;
        border-radius: var(--md-shape-full);
      }

      .nav-item .material-symbols-rounded { font-size: 22px; position: relative; z-index: 1; }
      .nav-item__lbl { font-size: 14px; font-weight: 500; text-align: left; position: relative; z-index: 1; flex: 1; }
    }

    /* =====================================================
       Main Content
    ===================================================== */
    .main-content { flex: 1; overflow-y: auto; }

    .tab-content {
      display: none;
      padding: 28px 24px;
      max-width: 1100px;
      margin: 0 auto;
      animation: pageIn .24s cubic-bezier(0.2,0,0,1) both;
    }

    .tab-content.active { display: block; }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 1024px) {
      .nav-rail { display: flex; }
      .bottom-nav { display: none !important; }
      .main-content { padding-bottom: 0; }
      .tab-content { padding: 32px 40px; }
    }

    @media (max-width: 1023px) {
      .main-content { padding-bottom: 80px; }
      .tab-content { padding: 20px 16px; }
    }

    /* =====================================================
       Bottom Navigation (Mobile)
    ===================================================== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--md-sys-color-surface-container);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      display: flex; height: 80px;
    }

    .bnav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; border: none; background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      font-family: inherit; font-size: 11px; font-weight: 500;
      padding: 8px 0 4px;
    }

    .bnav-item__pill {
      width: 56px; height: 32px;
      border-radius: var(--md-shape-full);
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }

    .bnav-item.active { color: var(--md-sys-color-on-secondary-container); }
    .bnav-item.active .bnav-item__pill { background: var(--md-sys-color-secondary-container); }
    .bnav-item .material-symbols-rounded { font-size: 22px; }
    .bnav-item.active .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* =====================================================
       Page Headers
    ===================================================== */
    .page-header { margin-bottom: 24px; }
    .page-header__eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--md-sys-color-primary); margin-bottom: 4px;
      display: flex; align-items: center; gap: 5px;
    }
    .page-header__eyebrow .material-symbols-rounded { font-size: 13px; }
    .page-header__title { font-size: 26px; font-weight: 400; line-height: 1.25; letter-spacing: -.01em; }
    .page-header__sub { font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-top: 5px; line-height: 1.5; }

    /* =====================================================
       Cards
    ===================================================== */
    .md-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-extra-large);
      padding: 22px;
      margin-bottom: 18px;
    }

    .md-card--elevated {
      background: var(--md-sys-color-surface-container-high);
      box-shadow: var(--md-elevation-1);
    }

    .card-hdr {
      display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px;
    }

    .card-hdr__icon {
      width: 46px; height: 46px;
      border-radius: var(--md-shape-medium);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .card-hdr__icon .material-symbols-rounded {
      font-size: 24px;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .card-hdr__text { flex: 1; }
    .card-title { font-size: 17px; font-weight: 500; margin-bottom: 2px; }
    .card-subtitle { font-size: 13px; color: var(--md-sys-color-on-surface-variant); line-height: 1.5; }

    /* =====================================================
       Desktop Grid
    ===================================================== */
    @media (min-width: 1024px) {
      .d-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    }

    /* =====================================================
       Forms
    ===================================================== */
    .md-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .md-field label { font-size: 12px; font-weight: 500; letter-spacing: .03em; color: var(--md-sys-color-on-surface-variant); }

    .md-input, .md-textarea {
      background: var(--md-sys-color-surface-container-highest);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-medium);
      color: var(--md-sys-color-on-surface);
      font-family: inherit; font-size: 15px;
      padding: 13px 16px; outline: none;
      transition: border-color .2s, box-shadow .2s; width: 100%;
    }

    .md-input:focus, .md-textarea:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px rgba(208,188,255,.12);
    }

    .md-textarea { min-height: 110px; resize: vertical; }

    .input-row { display: flex; gap: 8px; }
    .input-row .md-input { flex: 1; }

    /* =====================================================
       Buttons
    ===================================================== */
    .md-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: none; border-radius: var(--md-shape-full);
      cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500;
      letter-spacing: .025em; padding: 10px 22px;
      transition: box-shadow .2s, opacity .15s, background .15s;
      white-space: nowrap; text-decoration: none; min-height: 40px;
    }

    .md-btn .material-symbols-rounded { font-size: 18px; }
    .md-btn:disabled { opacity: .38; cursor: not-allowed; }

    .md-btn--filled { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .md-btn--filled:hover:not(:disabled) { box-shadow: var(--md-elevation-1); opacity: .95; }
    .md-btn--tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .md-btn--tonal:hover:not(:disabled) { box-shadow: var(--md-elevation-1); }
    .md-btn--outlined { background: transparent; border: 1.5px solid var(--md-sys-color-outline); color: var(--md-sys-color-primary); }
    .md-btn--text { background: transparent; color: var(--md-sys-color-primary); padding: 10px 12px; }
    .md-btn--text:hover:not(:disabled) { background: rgba(208,188,255,.08); }
    .md-btn--success { background: var(--md-sys-color-success-container); color: var(--md-sys-color-success); }
    .md-btn--sm { padding: 5px 14px; font-size: 12px; min-height: 32px; }
    .md-btn--icon { padding: 8px; width: 40px; height: 40px; border-radius: 50%; }

    .btn-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* =====================================================
       Chips
    ===================================================== */
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
    .md-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-full);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px; font-weight: 500; padding: 4px 12px;
    }
    .md-chip--primary { background: var(--md-sys-color-primary-container); border-color: transparent; color: var(--md-sys-color-on-primary-container); }
    .md-chip--secondary { background: var(--md-sys-color-secondary-container); border-color: transparent; color: var(--md-sys-color-on-secondary-container); }
    .md-chip .material-symbols-rounded { font-size: 14px; }

    /* =====================================================
       Progress
    ===================================================== */
    .md-progress { height: 4px; background: var(--md-sys-color-surface-container-highest); border-radius: 2px; overflow: hidden; margin: 7px 0; }
    .md-progress__bar { height: 100%; background: var(--md-sys-color-primary); border-radius: 2px; transition: width .4s ease; }
    .md-progress--indet .md-progress__bar { width: 40% !important; animation: indet 1.5s infinite ease-in-out; }
    @keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

    /* =====================================================
       Snackbar
    ===================================================== */
    .snackbar-container {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 999; display: flex; flex-direction: column; gap: 8px;
      min-width: 300px; max-width: 520px; pointer-events: none;
    }
    @media (max-width: 1023px) { .snackbar-container { bottom: 88px; } }

    .snackbar {
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-shape-medium); padding: 13px 20px;
      font-size: 14px; box-shadow: var(--md-elevation-3);
      display: flex; align-items: center; gap: 10px;
      animation: snackIn .28s cubic-bezier(0.2,0,0,1) both; pointer-events: auto;
    }
    .snackbar.removing { animation: snackOut .22s ease both; }
    .snackbar--error { border-left: 4px solid var(--md-sys-color-error); }
    .snackbar--success { border-left: 4px solid var(--md-sys-color-success); }
    .snackbar--warning { border-left: 4px solid var(--md-sys-color-warning); }
    @keyframes snackIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes snackOut { from { opacity: 1; } to { opacity: 0; transform: translateY(6px); } }

    /* =====================================================
       Divider
    ===================================================== */
    .md-divider { height: 1px; background: var(--md-sys-color-outline-variant); margin: 18px 0; }

    /* =====================================================
       Story Preview
    ===================================================== */
    #story-preview-card { display: none; }

    .story-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

    .story-code-badge {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-radius: var(--md-shape-small);
      padding: 3px 10px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    }

    .part-card {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-large);
      padding: 18px; margin-bottom: 10px;
      border-left: 3px solid var(--md-sys-color-primary-container);
    }

    .part-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .part-number-badge { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-radius: var(--md-shape-full); padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .part-text { font-size: 14px; line-height: 1.75; }
    .cliffhanger-hint { margin-top: 10px; font-size: 12px; color: var(--md-sys-color-tertiary); font-style: italic; display: flex; align-items: center; gap: 5px; }

    /* =====================================================
       Duplicate Banner
    ===================================================== */
    .duplicate-banner {
      background: var(--md-sys-color-tertiary-container);
      border-radius: var(--md-shape-large);
      padding: 14px 18px; margin-bottom: 14px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .duplicate-banner__icon { color: var(--md-sys-color-on-tertiary-container); flex-shrink: 0; }
    .duplicate-banner__title { font-weight: 600; margin-bottom: 3px; }
    .duplicate-banner__text { font-size: 14px; line-height: 1.5; }

    /* =====================================================
       Story Selection List
    ===================================================== */
    .story-select-list { display: flex; flex-direction: column; gap: 7px; }

    .story-select-item {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-large);
      padding: 14px 16px; cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .15s, background .15s;
      display: flex; align-items: center; gap: 12px;
    }

    .story-select-item:hover { background: var(--md-sys-color-surface-container-highest); }
    .story-select-item.selected { border-color: var(--md-sys-color-primary); }

    .story-select-item__radio {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--md-sys-color-outline);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: border-color .15s;
    }

    .story-select-item.selected .story-select-item__radio {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-primary);
    }

    .story-select-item.selected .story-select-item__radio::after {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--md-sys-color-on-primary);
    }

    .story-select-item__info { flex: 1; }
    .story-select-item__title { font-weight: 500; font-size: 15px; margin-bottom: 2px; }
    .story-select-item__meta { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

    /* =====================================================
       Queue
    ===================================================== */
    .queue-list { display: flex; flex-direction: column; gap: 8px; }

    .queue-item {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-large);
      padding: 14px 16px;
      border: 1px solid transparent; transition: border-color .3s;
    }

    .queue-item.is-processing { border-color: var(--md-sys-color-primary-container); }

    .queue-item__hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .queue-item__ico {
      width: 34px; height: 34px;
      border-radius: var(--md-shape-medium);
      background: var(--md-sys-color-surface-container-highest);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .queue-item__info { flex: 1; }
    .queue-item__title { font-weight: 500; font-size: 14px; }
    .queue-item__meta { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px; }

    .status-chip { border-radius: var(--md-shape-full); padding: 3px 10px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
    .status-chip--pending { background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface-variant); }
    .status-chip--processing { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .status-chip--done { background: #0A3818; color: var(--md-sys-color-success); }
    .status-chip--error { background: var(--md-sys-color-error-container); color: var(--md-sys-color-error); }

    .job-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .job-progress-bar-wrap { flex: 1; height: 6px; background: var(--md-sys-color-surface-container-highest); border-radius: 3px; overflow: hidden; }
    .job-progress-bar { height: 100%; background: var(--md-sys-color-primary); border-radius: 3px; transition: width .5s ease; }
    .job-progress-pct { font-size: 11px; font-weight: 700; color: var(--md-sys-color-primary); min-width: 32px; text-align: right; }
    .job-progress-label { font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 3px; font-style: italic; }

    .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--md-sys-color-primary); animation: pulse 1s infinite; margin-right: 4px; vertical-align: middle; }

    /* =====================================================
       Upload Zone
    ===================================================== */
    .upload-zone {
      border: 2px dashed var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-extra-large);
      padding: 44px 20px; text-align: center;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--md-sys-color-primary); background: rgba(208,188,255,.05); }
    .upload-zone__icon { color: var(--md-sys-color-on-surface-variant); margin-bottom: 14px; }
    .upload-zone__icon .material-symbols-rounded { font-size: 52px; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48; }
    .upload-zone__text { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .upload-zone__hint { font-size: 13px; color: var(--md-sys-color-on-surface-variant); }

    .bg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
    @media (min-width: 1024px) { .bg-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }

    .bg-thumb { position: relative; border-radius: var(--md-shape-large); overflow: hidden; background: var(--md-sys-color-surface-container-high); aspect-ratio: 9/16; cursor: pointer; }
    .bg-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .bg-thumb__overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 50%); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; opacity: 0; transition: opacity .2s; }
    .bg-thumb:hover .bg-thumb__overlay { opacity: 1; }
    .bg-thumb__name { font-size: 11px; color: #fff; word-break: break-all; }
    .bg-thumb__delete { position: absolute; top: 7px; right: 7px; background: rgba(0,0,0,.65); border: none; border-radius: 50%; width: 30px; height: 30px; color: var(--md-sys-color-error); cursor: pointer; display: none; align-items: center; justify-content: center; }
    .bg-thumb:hover .bg-thumb__delete { display: flex; }

    /* =====================================================
       Library — Video Cards
    ===================================================== */
    .library-story { margin-bottom: 32px; }
    .library-story__hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

    .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    @media (min-width: 1024px) { .lib-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }

    .lib-card {
      background: var(--md-sys-color-surface-container-high);
      border-radius: var(--md-shape-extra-large);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: box-shadow .2s, transform .15s;
    }
    .lib-card:hover { box-shadow: var(--md-elevation-2); transform: translateY(-1px); }

    .lib-card__thumb { aspect-ratio: 9/16; position: relative; background: #000; }
    .lib-card__thumb video { width: 100%; height: 100%; object-fit: cover; }
    .lib-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s; }
    .lib-card:hover .lib-cover { opacity: 0; }

    .lib-card__play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.28); opacity: 0; transition: opacity .2s;
    }
    .lib-card__play .material-symbols-rounded { font-size: 44px; color: #fff; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48; }
    .lib-card:hover .lib-card__play { opacity: 1; }

    .lib-card__body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .lib-card__part { font-weight: 600; font-size: 14px; }

    .lib-social { display: flex; flex-direction: column; gap: 4px; }
    .lib-social__title { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--md-sys-color-on-surface); }
    .lib-social__desc { font-size: 12px; color: var(--md-sys-color-on-surface-variant); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lib-social__tags { font-size: 11px; color: var(--md-sys-color-primary); line-height: 1.4; }

    .lib-copy-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--md-sys-color-surface-container-highest);
      border: none; border-radius: var(--md-shape-full);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      cursor: pointer; transition: background .15s;
      align-self: flex-start;
    }
    .lib-copy-btn:hover { background: var(--md-sys-color-outline-variant); }
    .lib-copy-btn .material-symbols-rounded { font-size: 13px; }

    .lib-platforms { display: flex; flex-wrap: wrap; gap: 6px; }

    .platform-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px;
      border-radius: var(--md-shape-full);
      font-size: 11px; font-weight: 500;
      border: 1.5px solid var(--md-sys-color-outline-variant);
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer; transition: all .15s;
      white-space: nowrap;
    }
    .platform-chip .material-symbols-rounded { font-size: 13px; }
    .platform-chip:hover { background: rgba(208,188,255,.07); }
    .platform-chip.uploaded {
      background: var(--md-sys-color-primary-container);
      border-color: transparent;
      color: var(--md-sys-color-on-primary-container);
    }
    .platform-chip.uploaded .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .lib-card__actions { display: flex; gap: 6px; }

    /* =====================================================
       Modal
    ===================================================== */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.82); z-index: 200;
      align-items: center; justify-content: center;
      padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-extra-large);
      max-width: 480px; width: 100%; overflow: hidden;
      box-shadow: var(--md-elevation-3);
      animation: modalIn .28s cubic-bezier(0.2,0,0,1);
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.93); } to { opacity: 1; transform: scale(1); } }

    .modal__hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px 14px;
    }
    .modal__title { font-size: 17px; font-weight: 500; }
    .modal__close {
      background: var(--md-sys-color-surface-container-highest);
      border: none; border-radius: 50%; width: 34px; height: 34px;
      cursor: pointer; color: var(--md-sys-color-on-surface-variant);
      display: flex; align-items: center; justify-content: center;
    }
    .modal__close:hover { background: var(--md-sys-color-outline-variant); }
    .modal__body { padding: 0 22px 22px; }
    .modal video { width: 100%; max-height: 80vh; border-radius: var(--md-shape-large); background: #000; aspect-ratio: 9/16; object-fit: contain; }

    /* =====================================================
       Prompt Builder
    ===================================================== */
    @media (min-width: 1024px) {
      .prompt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    }

    .import-result { background: var(--md-sys-color-success-container); border-radius: var(--md-shape-large); padding: 14px; display: none; }
    .import-result.visible { display: block; }
    .import-result__title { font-weight: 600; color: var(--md-sys-color-success); margin-bottom: 3px; }
    .import-result__body { font-size: 13px; }

    /* =====================================================
       Spinner & Empty States
    ===================================================== */
    .spinner { width: 24px; height: 24px; border: 3px solid var(--md-sys-color-surface-container-highest); border-top-color: var(--md-sys-color-primary); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state { text-align: center; padding: 52px 20px; color: var(--md-sys-color-on-surface-variant); }
    .empty-state__icon { margin-bottom: 14px; opacity: .4; }
    .empty-state__icon .material-symbols-rounded { font-size: 60px; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48; }
    .empty-state__text { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .empty-state__hint { font-size: 13px; }

    /* =====================================================
       Misc Utilities
    ===================================================== */
    .hidden { display: none !important; }
    .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .section-title { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .section-title .material-symbols-rounded { font-size: 15px; }
    .text-muted { color: var(--md-sys-color-on-surface-variant); font-size: 13px; }
    #sse-status { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }

    @media (max-width: 600px) { .top-app-bar__sub { display: none; } }

    /* =====================================================
       Mobile-Optimierungen (≤599px)
    ===================================================== */
    @media (max-width: 599px) {
      /* Top Bar kompakter */
      .top-app-bar { height: 56px; padding: 0 14px; gap: 10px; }
      .layout-body { height: calc(100vh - 56px); }
      .queue-badge { padding: 5px 11px; font-size: 12px; gap: 6px; }

      /* Tab-Inhalt */
      .tab-content { padding: 14px 12px; }
      .page-header { margin-bottom: 16px; }
      .page-header__title { font-size: 22px; }
      .page-header__sub { font-size: 13px; }

      /* Cards */
      .md-card { padding: 16px; border-radius: 20px; margin-bottom: 14px; }
      .card-hdr { gap: 10px; margin-bottom: 12px; }
      .card-hdr__icon { width: 40px; height: 40px; }
      .card-hdr__icon .material-symbols-rounded { font-size: 20px; }
      .card-title { font-size: 16px; }
      .card-subtitle { font-size: 12px; }

      /* Buttons: größere Touch-Ziele */
      .md-btn { min-height: 44px; }
      .md-btn--sm { min-height: 36px; }
      .md-btn--icon { min-height: 40px; width: 40px; }
      .btn-row { gap: 8px; }

      /* Formulare */
      .md-textarea { min-height: 160px !important; }
      .md-input, .md-textarea { font-size: 16px; } /* verhindert Auto-Zoom auf iOS */

      /* Queue */
      .queue-item { padding: 12px 13px; }
      .queue-item__title { font-size: 13px; }

      /* Story-Liste */
      .story-select-item { padding: 12px 13px; gap: 10px; }
      .story-select-item__title { font-size: 14px; }

      /* Library */
      .lib-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .lib-card__body { padding: 12px; }

      /* Hintergrund-Grid */
      .bg-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

      /* Upload-Zone */
      .upload-zone { padding: 32px 16px; }
      .upload-zone__icon .material-symbols-rounded { font-size: 40px; }

      /* Duplikat-Banner */
      .duplicate-banner { padding: 12px 14px; }
    }

    /* Extra klein (≤400px) */
    @media (max-width: 400px) {
      .page-header__title { font-size: 19px; }
      .top-app-bar__icon { width: 30px; height: 30px; font-size: 15px; letter-spacing: 0; }
      .top-app-bar__logo { font-size: 15px; }
      .md-card { padding: 14px; }
    }
  </style>
</head>

<body>

  <!-- Top App Bar -->
  <header class="top-app-bar">
    <div class="top-app-bar__brand">
      <div class="top-app-bar__icon">S</div>
      <div class="top-app-bar__titles">
        <span class="top-app-bar__logo">SARA</span>
        <span class="top-app-bar__sub">Story And Reel Automator</span>
      </div>
    </div>
    <div class="top-app-bar__spacer"></div>
    <div class="queue-badge" id="queue-badge">
      <div class="queue-dot" id="queue-dot"></div>
      <span id="queue-badge-text">Bereit</span>
    </div>
  </header>

  <!-- Snackbar -->
  <div class="snackbar-container" id="snackbar-container"></div>

  <!-- Video Modal -->
  <div class="modal-backdrop" id="video-modal">
    <div class="modal">
      <div class="modal__hdr">
        <span class="modal__title" id="modal-title">Video abspielen</span>
        <button class="modal__close" onclick="closeModal()">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      <div class="modal__body">
        <video id="modal-video" controls playsinline></video>
      </div>
    </div>
  </div>

  <!-- Layout -->
  <div class="layout-body">

    <!-- Navigation Rail / Drawer (Desktop) -->
    <nav class="nav-rail" id="nav-rail">
      <span class="nav-rail__label">Erstellen</span>

      <button class="nav-item active" id="snav-story" onclick="switchTab('story')">
        <div class="nav-item__pill"></div>
        <span class="material-symbols-rounded">auto_stories</span>
        <span class="nav-item__lbl">Story</span>
      </button>
      <button class="nav-item" id="snav-video" onclick="switchTab('video')">
        <div class="nav-item__pill"></div>
        <span class="material-symbols-rounded">movie</span>
        <span class="nav-item__lbl">Video</span>
      </button>
      <button class="nav-item" id="snav-library" onclick="switchTab('library')">
        <div class="nav-item__pill"></div>
        <span class="material-symbols-rounded">video_library</span>
        <span class="nav-item__lbl">Bibliothek</span>
      </button>

      <div class="nav-divider"></div>
      <span class="nav-rail__label">Tools</span>

      <button class="nav-item" id="snav-upload" onclick="switchTab('upload')">
        <div class="nav-item__pill"></div>
        <span class="material-symbols-rounded">video_file</span>
        <span class="nav-item__lbl">Hintergründe</span>
      </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav">
    <button class="bnav-item active" id="bnav-story" onclick="switchTab('story')">
      <div class="bnav-item__pill"><span class="material-symbols-rounded">auto_stories</span></div>
      <span>Story</span>
    </button>
    <button class="bnav-item" id="bnav-video" onclick="switchTab('video')">
      <div class="bnav-item__pill"><span class="material-symbols-rounded">movie</span></div>
      <span>Video</span>
    </button>
    <button class="bnav-item" id="bnav-library" onclick="switchTab('library')">
      <div class="bnav-item__pill"><span class="material-symbols-rounded">video_library</span></div>
      <span>Bibliothek</span>
    </button>
    <button class="bnav-item" id="bnav-upload" onclick="switchTab('upload')">
      <div class="bnav-item__pill"><span class="material-symbols-rounded">video_file</span></div>
      <span>Hintergrund</span>
    </button>
  </nav>

  <!-- Shared JavaScript -->
  <script>
    // ============================================================
    //  State
    // ============================================================
    let currentStory = null;
    let savedStoryId = null;
    let selectedStoryId = null;
    let currentTab = 'story';
    let pendingSelectStoryId = null;

    // ============================================================
    //  Tab Navigation
    // ============================================================
    const TAB_TO_NAV = {
      story:   ['snav-story',   'bnav-story'],
      video:   ['snav-video',   'bnav-video'],
      library: ['snav-library', 'bnav-library'],
      upload:  ['snav-upload',  'bnav-upload'],
    };

    function switchTab(name, pushHistory = true) {
      if (currentTab === name) return;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item, .bnav-item').forEach(el => el.classList.remove('active'));

      document.getElementById('tab-' + name).classList.add('active');
      (TAB_TO_NAV[name] || []).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      });
      currentTab = name;

      if (pushHistory) {
        history.pushState({ tab: name }, '', '/' + name);
      }

      // Wenn wir zu einem anderen Tab wechseln oder die Library neu laden,
      // stellen wir sicher, dass die Detailansicht geschlossen ist.
      if (name !== 'library' || pushHistory) {
        if (typeof closeLibDetail === 'function') closeLibDetail(false);
      }

      if (name === 'video')        { loadStoryList(); loadQueue(); }
      else if (name === 'library') { loadLibrary(); }
      else if (name === 'upload')  { loadBackgrounds(); }
    }

    window.addEventListener('popstate', e => {
      const tab = (e.state && e.state.tab) || 'story';
      const code = e.state && e.state.code;
      const prev = currentTab;
      currentTab = '';
      switchTab(tab, false);
      if (currentTab === prev) currentTab = tab;
      
      // Falls wir in der Library sind und einen Code haben
      if (tab === 'library' && code) {
        // Wir warten kurz bis die Library geladen ist
        setTimeout(() => {
          if (typeof _libData !== 'undefined') {
            const story = _libData.find(s => s.code === code);
            if (story) openLibDetail(story, false);
          }
        }, 300);
      } else if (tab === 'library') {
        if (typeof closeLibDetail === 'function') closeLibDetail(false);
      }
    });

    // ============================================================
    //  Snackbar
    // ============================================================
    function showSnack(msg, type = '') {
      const el = document.createElement('div');
      el.className = 'snackbar' + (type ? ' snackbar--' + type : '');
      el.textContent = msg;
      document.getElementById('snackbar-container').appendChild(el);
      setTimeout(() => { el.classList.add('removing'); setTimeout(() => el.remove(), 300); }, 4500);
    }

    // ============================================================
    //  Queue — SSE Live
    // ============================================================
    let _sseSource = null;

    function startSSE() {
      if (_sseSource) return;
      _sseSource = new EventSource('/api/queue/live');
      _sseSource.onopen = () => {
        const el = document.getElementById('sse-status');
        if (el) el.innerHTML = '<span class="live-dot"></span>Live';
      };
      _sseSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          const jobs = data.jobs || data; 
          if (data.prod_active !== undefined) _prodActive = data.prod_active;
          
          if (!Array.isArray(jobs)) return;
          renderQueueList(jobs);
          const stats = {};
          jobs.forEach(j => { stats[j.status] = (stats[j.status] || 0) + 1; });
          renderQueueStats(stats);
          updateTopBadge(stats);
        } catch (_) { }
      };
      _sseSource.onerror = () => {
        const el = document.getElementById('sse-status');
        if (el) el.textContent = '⚠ Verbindung getrennt';
        _sseSource.close(); _sseSource = null;
        setTimeout(startSSE, 3000);
      };
    }

    async function loadQueue() {
      try {
        const [jobs, stats] = await Promise.all([
          fetch('/api/queue').then(r => r.json()),
          fetch('/api/queue/stats').then(r => r.json())
        ]);
        renderQueueStats(stats); renderQueueList(jobs); updateTopBadge(stats);
      } catch (_) { }
    }

    function renderQueueStats(stats) {
      const el = document.getElementById('queue-stats');
      if (!el) return;
      const defs = [
        ['pending',    'Wartend',  'hourglass_empty', ''],
        ['processing', 'Läuft',    'settings',        'md-chip--primary'],
        ['done',       'Fertig',   'check_circle',    ''],
        ['error',      'Fehler',   'error',           ''],
      ];
      el.innerHTML = defs.filter(([k]) => stats[k])
        .map(([k, lbl, ico, cls]) => `<span class="md-chip ${cls}">
          <span class="material-symbols-rounded" style="font-size:14px">${ico}</span>${lbl}: ${stats[k]}</span>`)
        .join('');
    }

    function renderQueueList(jobs) {
      const container = document.getElementById('queue-list');
      if (!container) return;
      if (!jobs.length) {
        container.innerHTML = `<div class="empty-state" style="padding:24px 0">
          <div class="empty-state__icon"><span class="material-symbols-rounded">hourglass_empty</span></div>
          <div class="empty-state__text">Warteschlange ist leer</div>
        </div>`;
        return;
      }
      const existing = {};
      container.querySelectorAll('.queue-item[data-job-id]').forEach(el => { existing[el.dataset.jobId] = el; });
      const rendered = new Set();

      jobs.forEach(job => {
        rendered.add(String(job.id));
        let div = existing[String(job.id)];
        const isProc = job.status === 'processing';
        const pct = job.progress_pct || 0;
        const lbl = job.progress_label || '';
        const icoMap = { pending: 'hourglass_empty', processing: 'settings', done: 'check_circle', error: 'error' };

        if (!div) {
          div = document.createElement('div');
          div.className = 'queue-item';
          div.dataset.jobId = job.id;
          container.insertBefore(div, container.firstChild);
        }
        div.classList.toggle('is-processing', isProc);
        div.innerHTML = `
          <div class="queue-item__hdr">
            <div class="queue-item__ico"><span class="material-symbols-rounded" style="font-size:19px">${icoMap[job.status] || 'help'}</span></div>
            <div class="queue-item__info">
              <div class="queue-item__title">${escHtml(job.title)} — Teil ${job.part_number}</div>
              <div class="queue-item__meta">[${job.code}] · ${formatDate(job.created_at)} ${job.started_at ? `&middot; ⏱ ${getDuration(job.started_at, job.finished_at)}` : ''}</div>
            </div>
            <span class="status-chip status-chip--${job.status}">${statusLabel(job.status)}</span>
          </div>
          ${isProc ? `<div class="job-progress-row"><div class="job-progress-bar-wrap"><div class="job-progress-bar" style="width:${pct}%"></div></div><span class="job-progress-pct">${pct}%</span></div>${lbl ? `<div class="job-progress-label">${escHtml(lbl)}</div>` : ''}` : (job.status === 'done' && lbl) ? `<div class="job-progress-label" style="color:var(--md-sys-color-success)">${escHtml(lbl)}</div>` : ''}
          ${job.status === 'error' ? `<div style="font-size:12px;margin-top:5px;color:var(--md-sys-color-error)">${escHtml(job.error_msg || 'Fehler')}</div>` : ''}
          ${!isProc ? `
          <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
            ${job.status === 'pending' ? `<button class="md-btn md-btn--outlined md-btn--sm" onclick="cancelJob(${job.id})"><span class="material-symbols-rounded">cancel</span>Abbrechen</button>` : ''}
            ${(job.status === 'error' || job.status === 'done') ? `<button class="md-btn md-btn--tonal md-btn--sm" onclick="restartJob(${job.id})"><span class="material-symbols-rounded">refresh</span>Neustart</button>` : ''}
            <button class="md-btn md-btn--text md-btn--sm" style="color: var(--md-sys-color-error);" onclick="deleteJob(${job.id})"><span class="material-symbols-rounded">delete</span>Löschen</button>
          </div>
          ` : ''}
        `;
      });
      Object.entries(existing).forEach(([id, el]) => { if (!rendered.has(id)) el.remove(); });
    }

    async function cancelJob(id) {
      try {
        const res = await fetch('/api/queue/' + id + '/cancel', { method: 'POST' });
        const json = await res.json();
        if (json.success) showSnack('Aufgabe abgebrochen', 'success');
        else showSnack(json.error || 'Fehler beim Abbrechen', 'error');
        loadQueue();
      } catch (e) { showSnack('Netzwerkfehler', 'error'); }
    }

    async function restartJob(id) {
      try {
        const res = await fetch('/api/queue/' + id + '/restart', { method: 'POST' });
        const json = await res.json();
        if (json.success) showSnack('Aufgabe neugestartet', 'success');
        else showSnack(json.error || 'Fehler beim Neustart', 'error');
        loadQueue();
      } catch (e) { showSnack('Netzwerkfehler', 'error'); }
    }

    async function deleteJob(id) {
      if (!confirm('Aufgabe wirklich aus der Warteschlange löschen?')) return;
      try {
        const res = await fetch('/api/queue/' + id, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) showSnack('Aufgabe gelöscht', 'success');
        else showSnack(json.error || 'Fehler beim Löschen', 'error');
        loadQueue();
      } catch (e) { showSnack('Netzwerkfehler', 'error'); }
    }

    function updateTopBadge(stats) {
      const dot = document.getElementById('queue-dot');
      const text = document.getElementById('queue-badge-text');
      if (!dot || !text) return;
      const proc = stats['processing'] || 0, pend = stats['pending'] || 0;
      if (proc > 0)       { dot.className = 'queue-dot active'; text.textContent = `${proc} läuft`; }
      else if (pend > 0)  { dot.className = 'queue-dot active'; text.textContent = `${pend} wartend`; }
      else                { dot.className = 'queue-dot'; text.textContent = 'Bereit'; }
    }

    function statusLabel(s) {
      const m = { pending: 'Wartend', processing: 'Läuft…', done: 'Fertig', error: 'Fehler' };
      return m[s] || s;
    }

    let _prodActive = true;
    function getDuration(startStr, endStr) {
      if (!startStr) return '';
      if (!_prodActive && !endStr) return 'Pausiert';
      const start = new Date(startStr.replace(' ', 'T') + 'Z').getTime();
      const end = endStr ? new Date(endStr.replace(' ', 'T') + 'Z').getTime() : Date.now();
      const diff = Math.floor((end - start) / 1000);
      if (diff < 0) return '0s';
      const m = Math.floor(diff / 60);
      const s = diff % 60;
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }

    // ============================================================
    //  Utilities
    // ============================================================
    function setLoading(id, loading) {
      const btn = document.getElementById('btn-' + id);
      const spinner = document.getElementById(id + '-spinner');
      if (btn) btn.disabled = loading;
      if (spinner) spinner.classList.toggle('hidden', !loading);
    }

    function escHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr.replace(' ', 'T') + 'Z');
        return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (_) { return isoStr; }
    }

    function formatDateShort(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr.replace(' ', 'T') + 'Z');
        return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
      } catch (_) { return ''; }
    }

    async function updateBadgeOnly() {
      try {
        const stats = await fetch('/api/queue/stats').then(r => r.json());
        updateTopBadge(stats);
      } catch (_) { }
    }
  </script>

  <!-- Page-specific scripts (injected by each included page) -->
  {% block page_scripts %}{% endblock %}

  <!-- Init (runs after all page scripts are defined) -->
  <script>
    startSSE();
    updateBadgeOnly();
    initPromptTemplate();

    document.getElementById('video-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    (function () {
      const parts = window.location.pathname.replace(/^\//, '').split('/');
      const path = parts[0];
      const code = parts[1];
      const initTab = TAB_TO_NAV[path] ? path : 'story';

      if (!window.location.pathname || window.location.pathname === '/') {
        history.replaceState({ tab: 'story' }, '', '/story');
      } else {
        const state = { tab: initTab };
        if (initTab === 'library' && code) state.code = code;
        history.replaceState(state, '', window.location.pathname);
      }

      // Initialen Tab aktivieren
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item, .bnav-item').forEach(el => el.classList.remove('active'));
      
      const tabEl = document.getElementById('tab-' + initTab);
      if (tabEl) tabEl.classList.add('active');
      
      (TAB_TO_NAV[initTab] || []).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      });
      
      currentTab = initTab;
      
      // Daten laden
      if (initTab === 'video')        { loadStoryList(); loadQueue(); }
      else if (initTab === 'upload')  { loadBackgrounds(); }
      else if (initTab === 'library') {
        loadLibrary().then(() => {
          if (code) {
            const story = _libData.find(s => s.code === code);
            if (story) openLibDetail(story, false);
          }
        });
      }
    })();
  </script>

</body>
</html>
