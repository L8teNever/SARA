<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>SARA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
/* ── Tokens ──────────────────────────────────────────────── */
:root {
  --cp:    #D0BCFF; --cop:   #381E72;
  --cpc:   #4F378B; --copc:  #EADDFF;
  --csc:   #4A4458; --cosc:  #E8DEF8;
  --ctc:   #633B48; --cotc:  #FFD8E4;
  --cs:    #141218;
  --cs0:   #1D1B20;
  --cs1:   #211F26;
  --cs2:   #2B2930;
  --cs3:   #36343B;
  --cos:   #E6E1E5;
  --cosv:  #CAC4D0;
  --co:    #938F99;
  --cov:   #49454F;
  --ce:    #F2B8B5; --cec: #8C1D18;
  --cg:    #6DD58C; --cgc: #0A3818;
  --cw:    #FFB951;
  --r1: 8px; --r2: 12px; --r3: 16px; --r4: 28px; --rf: 9999px;
  --rail: 80px; --topbar: 56px; --botnav: 72px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Roboto Flex',Roboto,sans-serif;font-size:14px;line-height:1.5;color:var(--cos);background:var(--cs);-webkit-font-smoothing:antialiased}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
.mi{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:24px;line-height:1;user-select:none;font-style:normal}

/* ── Shell ───────────────────────────────────────────────── */
.shell{display:flex;height:100vh;overflow:hidden}
.content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pages{flex:1;overflow-y:auto;overflow-x:hidden}

/* ── Nav Rail (desktop) ──────────────────────────────────── */
.rail{width:var(--rail);flex-shrink:0;background:var(--cs0);border-right:1px solid var(--cov);display:flex;flex-direction:column;align-items:center;padding:14px 0}
.rail__logo{width:40px;height:40px;border-radius:var(--r2);background:var(--cpc);color:var(--copc);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;margin-bottom:14px;flex-shrink:0}
.rail__item{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;padding:11px 0 9px;border-radius:var(--r3);color:var(--cosv);font-size:10px;font-weight:500;transition:background .15s,color .15s;letter-spacing:.01em}
.rail__item:hover{background:rgba(208,188,255,.08);color:var(--cos)}
.rail__item.is-active{background:var(--csc);color:var(--cosc)}
.rail__item .mi{font-size:22px}
.rail__queue{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;font-size:10px;color:var(--cosv);width:68px;text-align:center;line-height:1.25;position:relative}
.rail__queue .qdot{position:absolute;top:6px;right:12px}

/* ── Top Bar (mobile) ────────────────────────────────────── */
.topbar{height:var(--topbar);background:var(--cs0);border-bottom:1px solid var(--cov);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;display:none}
.topbar__logo{width:34px;height:34px;border-radius:var(--r1);background:var(--cpc);color:var(--copc);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.topbar__title{font-size:18px;font-weight:600}
.topbar__space{flex:1}
.topbar__qbadge{display:flex;align-items:center;gap:5px;background:var(--cs3);padding:5px 11px;border-radius:var(--rf);font-size:12px;font-weight:500;color:var(--cosv)}

/* ── Bottom Nav (mobile) ─────────────────────────────────── */
.botnav{display:none;height:var(--botnav);background:var(--cs0);border-top:1px solid var(--cov);flex-shrink:0}
.botnav__item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;color:var(--cosv);transition:color .15s;padding:8px 0}
.botnav__item:hover{color:var(--cos)}
.botnav__item.is-active{color:var(--cp)}
.botnav__item.is-active .mi{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.botnav__item .mi{font-size:22px}

/* ── Queue dot ───────────────────────────────────────────── */
.qdot{width:7px;height:7px;border-radius:50%;background:var(--co);flex-shrink:0}
.qdot.live{background:var(--cg);animation:pulse 1.5s infinite}

/* ── Page tabs ───────────────────────────────────────────── */
.page{display:none}
.page.is-active{display:block;animation:pageIn .22s cubic-bezier(.2,0,0,1)}
.wrap{max-width:700px;margin:0 auto;padding:20px 18px 32px}

/* ── Cards ───────────────────────────────────────────────── */
.card{background:var(--cs2);border-radius:var(--r3);padding:18px;margin-bottom:14px}
.card:last-child{margin-bottom:0}
.tbox{display:flex;align-items:center;gap:12px;background:var(--cpc);color:var(--copc);border-radius:var(--r3);padding:14px 16px;margin-bottom:14px}
.tbox--surface{background:var(--cs3);color:var(--cos);border:1.5px solid var(--cov)}
.tbox--warn{background:rgba(255,185,81,.1);color:var(--cos);border:1.5px solid rgba(255,185,81,.3)}

/* ── Buttons ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 20px;height:40px;border-radius:var(--rf);font-size:14px;font-weight:500;transition:opacity .15s,background .15s;cursor:pointer;border:none;white-space:nowrap;letter-spacing:.01em}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn .mi{font-size:18px}
.btn--filled{background:var(--cp);color:var(--cop)}
.btn--filled:hover:not(:disabled){opacity:.9}
.btn--tonal{background:var(--csc);color:var(--cosc)}
.btn--tonal:hover:not(:disabled){opacity:.88}
.btn--outlined{background:transparent;color:var(--cp);border:1.5px solid var(--cov)}
.btn--outlined:hover:not(:disabled){background:rgba(208,188,255,.08)}
.btn--text{background:transparent;color:var(--cp);padding:0 12px}
.btn--text:hover:not(:disabled){background:rgba(208,188,255,.08)}
.btn--danger{background:transparent;color:var(--ce);padding:0 12px}
.btn--danger:hover:not(:disabled){background:rgba(242,184,181,.08)}
.btn--icon{width:40px;height:40px;padding:0;border-radius:var(--rf);background:transparent;color:var(--cosv)}
.btn--icon:hover{background:rgba(230,225,229,.08);color:var(--cos)}
.btn--lg{height:52px;width:100%;font-size:15px;font-weight:600;border-radius:var(--r3)}
.btn--sm{height:32px;padding:0 12px;font-size:12px}
.btn--sm .mi{font-size:15px}
.btn--ok{background:var(--cgc);color:var(--cg);border:1.5px solid rgba(109,213,140,.25)}
.btn--ok:hover:not(:disabled){opacity:.88}

/* ── Form fields ─────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.flabel{font-size:11px;font-weight:600;color:var(--cosv);letter-spacing:.05em;text-transform:uppercase}
.inp{width:100%;height:52px;padding:0 14px;background:var(--cs3);border:1.5px solid var(--cov);border-radius:var(--r2);color:var(--cos);font-size:15px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--cp)}
.inp::placeholder{color:var(--cosv);opacity:.6}
.ta{width:100%;padding:12px 14px;background:var(--cs3);border:1.5px solid var(--cov);border-radius:var(--r2);color:var(--cos);font-size:14px;resize:vertical;outline:none;transition:border-color .15s;line-height:1.55}
.ta:focus{border-color:var(--cp)}
.ta::placeholder{color:var(--cosv);opacity:.6}

/* ── List items ──────────────────────────────────────────── */
.li{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:var(--r3);cursor:pointer;border:1.5px solid transparent;transition:background .15s,border-color .15s;margin-bottom:3px}
.li:hover{background:var(--cs3)}
.li.is-sel{background:var(--csc);border-color:var(--cp);color:var(--cosc)}
.li.is-sel:hover{background:var(--csc)}
.li.is-dim{opacity:.4;filter:saturate(.4)}
.li.is-dim:hover{opacity:.6}
.li__lead{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:18px}
.li__body{flex:1;min-width:0}
.li__title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li__sub{font-size:11px;color:var(--cosv);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li__trail{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* ── Status dot ──────────────────────────────────────────── */
.sdot{width:8px;height:8px;border-radius:50%;background:var(--co);flex-shrink:0}
.sdot--on{background:var(--cp);animation:pulse 1.5s infinite}
.sdot--ok{background:var(--cg)}

/* ── Chips ───────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--rf);font-size:11px;font-weight:600;white-space:nowrap}
.chip--pend{background:var(--cs3);color:var(--cosv)}
.chip--proc{background:var(--cpc);color:var(--copc)}
.chip--done{background:var(--cgc);color:var(--cg)}
.chip--err {background:var(--cec);color:var(--ce)}

.fchip{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--rf);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--cov);background:transparent;color:var(--cosv);transition:background .15s,color .15s,border-color .15s}
.fchip:hover{background:rgba(208,188,255,.08);color:var(--cos)}
.fchip.is-on{background:var(--csc);color:var(--cosc);border-color:transparent}
.fchip .mi{font-size:15px}

/* ── Badge (code) ────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:var(--r1);background:var(--cs3);color:var(--cosv);font-family:'Courier New',monospace;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}

/* ── Section label ───────────────────────────────────────── */
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cosv);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.lbl:first-child{margin-top:0}
.lbl::after{content:'';flex:1;height:1px;background:var(--cov)}
.lbl .mi{font-size:15px;text-transform:none;letter-spacing:0;opacity:.7;flex-shrink:0}

.divider{height:1px;background:var(--cov);border:none;margin:14px 0}

/* ── Collapse separator ──────────────────────────────────── */
.csep{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:5px 0;margin:4px 0}
.csep__line{flex:1;height:1px;background:var(--cov)}
.csep__txt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cosv);opacity:.7;white-space:nowrap;display:flex;align-items:center;gap:4px}
.csep__ico{font-size:16px !important;transition:transform .2s}
.csep__ico.col{transform:rotate(-90deg)}

/* ── Queue job cards ─────────────────────────────────────── */
.jcard{background:var(--cs2);border-radius:var(--r2);padding:11px 13px;margin-bottom:5px;border:1.5px solid transparent;transition:border-color .15s}
.jcard--on{border-color:var(--cpc)}
.jcard__hdr{display:flex;align-items:center;gap:8px}
.jcard__ico{color:var(--cosv);display:flex;align-items:center;flex-shrink:0}
.jcard__ico .mi{font-size:18px}
.jcard__title{font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jcard__meta{font-size:11px;color:var(--cosv);margin-top:3px}
.jcard__bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.jcard__track{flex:1;height:4px;background:var(--cs3);border-radius:2px;overflow:hidden}
.jcard__fill{height:100%;background:var(--cp);border-radius:2px;transition:width .5s ease}
.jcard__pct{font-size:11px;font-weight:700;color:var(--cp);min-width:28px;text-align:right}
.jcard__plbl{font-size:11px;color:var(--cosv);font-style:italic;margin-top:4px}
.jcard__err{font-size:11px;color:var(--ce);margin-top:4px}
.jcard__acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ── Library rows ────────────────────────────────────────── */
.lrow{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r3);background:var(--cs2);cursor:pointer;border:1.5px solid transparent;transition:background .15s,border-color .15s;margin-bottom:5px}
.lrow:hover{background:var(--cs3)}
.lrow__info{flex:1;min-width:0}
.lrow__title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow__meta{font-size:12px;color:var(--cosv);margin-top:2px}
.lrow__plat{display:flex;gap:3px;flex-shrink:0}
.pdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:var(--cs3);color:var(--cosv)}
.pdot--ok{background:var(--cpc);color:var(--copc)}

/* ── Video cards (library detail) ───────────────────────── */
.vcard{display:flex;gap:13px;align-items:flex-start;padding:14px;background:var(--cs2);border-radius:var(--r3);margin-bottom:10px}
.vcard__thumb{width:68px;aspect-ratio:9/16;border-radius:var(--r2);background:#000;position:relative;overflow:hidden;flex-shrink:0;cursor:pointer}
.vcard__thumb img,.vcard__thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.vcard__thumb video{opacity:0}
.vcard__thumb:hover video{opacity:1}
.vcard__thumb:hover img{opacity:0}
.vcard__pov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.vcard__thumb:hover .vcard__pov{opacity:1}
.vcard__pov .mi{font-size:26px;color:#fff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.vcard__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.vcard__part{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cp)}
.vcard__ttl{font-size:14px;font-weight:500;line-height:1.35}
.vcard__desc{font-size:12px;color:var(--cosv);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard__tags{font-size:11px;color:var(--cp)}
.vcard__plat{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.vcard__acts{display:flex;gap:5px;flex-wrap:wrap}

/* ── Platform toggle chips ───────────────────────────────── */
.pchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--rf);font-size:11px;font-weight:500;cursor:pointer;border:1.5px solid var(--cov);background:transparent;color:var(--cosv);transition:background .15s,color .15s,border-color .15s}
.pchip:hover{border-color:var(--co);color:var(--cos)}
.pchip--ok{background:var(--cgc);color:var(--cg);border-color:transparent}
.pchip .mi{font-size:14px}

/* ── Drop zone ───────────────────────────────────────────── */
.dropzone{border:2px dashed var(--cov);border-radius:var(--r3);padding:40px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:14px}
.dropzone:hover,.dropzone--on{border-color:var(--cp);background:rgba(208,188,255,.04)}
.dropzone .mi{font-size:42px;color:var(--cosv)}
.dropzone__ttl{font-size:16px;font-weight:500;margin-top:10px}
.dropzone__hint{font-size:12px;color:var(--cosv);margin-top:4px}

/* ── Bg grid ─────────────────────────────────────────────── */
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.bgthumb{aspect-ratio:9/16;border-radius:var(--r2);background:var(--cs3);position:relative;overflow:hidden;cursor:pointer}
.bgthumb video{width:100%;height:100%;object-fit:cover}
.bgthumb__ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 55%);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:6px 8px;opacity:0;transition:opacity .2s}
.bgthumb:hover .bgthumb__ov{opacity:1}
.bgthumb__name{font-size:10px;color:#fff;font-weight:500;word-break:break-all}
.bgthumb__del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:var(--ce);opacity:0;transition:opacity .2s}
.bgthumb:hover .bgthumb__del{opacity:1}
.bgthumb__del .mi{font-size:15px}

/* ── Progress ────────────────────────────────────────────── */
.pbar{height:4px;background:var(--cs3);border-radius:2px;overflow:hidden;flex:1}
.pbar__fill{height:100%;background:var(--cp);border-radius:2px;transition:width .3s ease}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0}

/* ── Import result ───────────────────────────────────────── */
.impres{display:none;padding:13px;border-radius:var(--r2);background:var(--cgc);border:1.5px solid rgba(109,213,140,.3);margin-top:12px}
.impres.show{display:block}
.impres__ttl{font-weight:600;color:var(--cg);margin-bottom:3px;font-size:14px}
.impres__body{font-size:13px;color:var(--cosv)}

/* ── Utilities ───────────────────────────────────────────── */
.muted{color:var(--cosv);opacity:.7}
.hidden{display:none !important}
.spinner{width:24px;height:24px;border:2.5px solid var(--cov);border-top-color:var(--cp);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.spinner--lg{width:36px;height:36px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 24px;text-align:center;gap:8px;color:var(--cosv)}
.empty .mi{font-size:38px;opacity:.45}
.empty__ttl{font-size:15px;font-weight:500;color:var(--cos)}
.empty__sub{font-size:13px;opacity:.7}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── Modal ───────────────────────────────────────────────── */
.mback{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}
.mback.open{display:flex}
.modal{background:var(--cs1);border-radius:var(--r4);padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:mIn .28s cubic-bezier(.2,0,0,1);box-shadow:0 8px 40px rgba(0,0,0,.55)}
.modal__hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal__ttl{flex:1;font-size:16px;font-weight:600}
/* confirm dialog */
.cdlg{max-width:360px;padding:24px}
.cdlg__ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;margin-bottom:14px}
.cdlg__ico--warn{background:rgba(255,100,80,.15);color:#FF6450}
.cdlg__ico--info{background:var(--cpc);color:var(--copc)}
.cdlg__ttl{font-size:16px;font-weight:600;margin-bottom:8px}
.cdlg__msg{font-size:13px;color:var(--cosv);line-height:1.6;margin-bottom:22px;white-space:pre-wrap}
.cdlg__acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ── Snackbar ────────────────────────────────────────────── */
.snack{background:var(--cs3);color:var(--cos);padding:12px 18px;border-radius:var(--r3);font-size:13px;font-weight:500;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:snkIn .25s ease;border-left:4px solid transparent;max-width:100%;word-break:break-word}
.snack--error{border-left-color:var(--ce)}
.snack--success{border-left-color:var(--cg)}
.snack--warning{border-left-color:var(--cw)}
.snack.out{animation:snkOut .3s ease forwards}

/* ── Animations ──────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes snkIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes snkOut{to{opacity:0;transform:scale(.88)}}
@keyframes mIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:899px){
  .rail{display:none}
  .topbar{display:flex}
  .botnav{display:flex}
  .wrap{padding:14px 14px calc(14px + var(--botnav))}
}
@media(min-width:900px){
  .rail{display:flex}
  .topbar{display:none}
  .botnav{display:none}
}
@media(max-width:599px){
  .inp,.ta{font-size:16px}
  .vcard{flex-direction:column}
  .vcard__thumb{width:100%;aspect-ratio:16/9}
}
  </style>
</head>
<body>

<div class="shell">
  <!-- Navigation Rail -->
  <nav class="rail">
    <div class="rail__logo">S</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:100%">
      <button class="rail__item nav-btn is-active" data-tab="story" onclick="switchTab('story')">
        <span class="mi">auto_stories</span><span>Story</span>
      </button>
      <button class="rail__item nav-btn" data-tab="video" onclick="switchTab('video')">
        <span class="mi">movie</span><span>Video</span>
      </button>
      <button class="rail__item nav-btn" data-tab="library" onclick="switchTab('library')">
        <span class="mi">video_library</span><span>Bibliothek</span>
      </button>
      <button class="rail__item nav-btn" data-tab="upload" onclick="switchTab('upload')">
        <span class="mi">video_file</span><span>Hintergrund</span>
      </button>
    </div>
    <div class="rail__queue">
      <div class="qdot" id="rail-qdot" style="position:absolute;top:6px;right:11px"></div>
      <span class="mi" style="font-size:18px;opacity:.6">queue</span>
      <span id="rail-qtxt">Bereit</span>
    </div>
  </nav>

  <!-- Content -->
  <div class="content">
    <!-- Top bar (mobile) -->
    <header class="topbar">
      <div class="topbar__logo">S</div>
      <span class="topbar__title">SARA</span>
      <div class="topbar__space"></div>
      <div class="topbar__qbadge">
        <div class="qdot" id="top-qdot"></div>
        <span id="top-qtxt">Bereit</span>
      </div>
    </header>

    <!-- Pages -->
    <div class="pages">
      {% block content %}{% endblock %}
    </div>

    <!-- Bottom nav (mobile) -->
    <nav class="botnav">
      <button class="botnav__item nav-btn is-active" data-tab="story" onclick="switchTab('story')">
        <span class="mi">auto_stories</span><span>Story</span>
      </button>
      <button class="botnav__item nav-btn" data-tab="video" onclick="switchTab('video')">
        <span class="mi">movie</span><span>Video</span>
      </button>
      <button class="botnav__item nav-btn" data-tab="library" onclick="switchTab('library')">
        <span class="mi">video_library</span><span>Bibliothek</span>
      </button>
      <button class="botnav__item nav-btn" data-tab="upload" onclick="switchTab('upload')">
        <span class="mi">video_file</span><span>Hintergrund</span>
      </button>
    </nav>
  </div>
</div>

<!-- Video Modal -->
<div class="mback" id="video-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal__hdr">
      <span class="modal__ttl" id="modal-title"></span>
      <button class="btn btn--icon" onclick="closeModal()"><span class="mi">close</span></button>
    </div>
    <video id="modal-video" controls playsinline style="width:100%;border-radius:12px;max-height:70vh;display:block"></video>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="mback" id="confirm-modal" onclick="if(event.target===this)_cdlgClose(false)">
  <div class="modal cdlg">
    <div class="cdlg__ico cdlg__ico--warn" id="cdlg-ico"><span class="mi">warning</span></div>
    <div class="cdlg__ttl" id="cdlg-title"></div>
    <div class="cdlg__msg" id="cdlg-msg"></div>
    <div class="cdlg__acts">
      <button class="btn btn--text btn--sm" id="cdlg-cancel" onclick="_cdlgClose(false)">Abbrechen</button>
      <button class="btn btn--filled btn--sm" id="cdlg-ok" onclick="_cdlgClose(true)">Bestätigen</button>
    </div>
  </div>
</div>

<!-- Snack container -->
<div id="snack-wrap" style="position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,90vw)"></div>

<script>
/* ── State ───────────────────────────────────────────────── */
let currentTab = 'story';
let selectedStoryId = null;
let pendingSelectStoryId = null;
let pendingLibraryCode = null;
let _sseSource = null;
let _prodActive = true;

/* ── Utils ───────────────────────────────────────────────── */
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function formatDate(s){if(!s)return'–';try{return new Date(s).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return s}}
function formatDateShort(s){if(!s)return'–';try{return new Date(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}catch{return s}}
function getDuration(a,b){if(!a)return'–';try{const d=Math.round((new Date(b||Date.now())-new Date(a))/1000);if(d<0)return'Pausiert';const m=Math.floor(d/60),s=d%60;return m?`${m}m ${s}s`:`${s}s`}catch{return'–'}}
function statusLabel(s){return{pending:'Wartend',processing:'Läuft…',done:'Fertig',error:'Fehler'}[s]||s}

/* ── Snackbar ────────────────────────────────────────────── */
function showSnack(msg, type=''){
  const w=document.getElementById('snack-wrap');
  const el=document.createElement('div');
  el.className='snack'+(type?' snack--'+type:'');
  el.textContent=msg;
  w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},4500);
}

/* ── Navigation ──────────────────────────────────────────── */
const TAB_URL={story:'/',video:'/video',library:'/library',upload:'/upload'};

function switchTab(name, push=true){
  currentTab=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('is-active'));
  const pg=document.querySelector(`.page[data-tab="${name}"]`);
  if(pg) pg.classList.add('is-active');
  document.querySelectorAll('.nav-btn[data-tab]').forEach(el=>{
    el.classList.toggle('is-active', el.dataset.tab===name);
  });
  if(push) history.pushState({tab:name},'',TAB_URL[name]||'/');
  if(name==='story'  && typeof loadRecentStories==='function') loadRecentStories();
  if(name==='video'  && typeof loadStoryList==='function'){loadStoryList();loadQueue();}
  if(name==='library'&& typeof loadLibrary==='function') loadLibrary();
  if(name==='upload' && typeof loadBackgrounds==='function') loadBackgrounds();
}

/* ── SSE / Queue ─────────────────────────────────────────── */
function startSSE(){
  if(_sseSource) return;
  _sseSource=new EventSource('/api/queue/live');
  _sseSource.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.jobs)  renderQueueList(d.jobs);
      if(d.stats){renderQueueStats(d.stats);updateQBadge(d.stats)}
      if(typeof d.prod_active!=='undefined'){_prodActive=d.prod_active;if(typeof updateProdBtn==='function')updateProdBtn()}
    }catch(_){}
  };
  _sseSource.onerror=()=>{
    const el=document.getElementById('sse-status');
    if(el) el.textContent='⚠';
    _sseSource.close();_sseSource=null;
    setTimeout(startSSE,3000);
  };
}

async function loadQueue(){
  try{
    const [jobs,stats]=await Promise.all([fetch('/api/queue').then(r=>r.json()),fetch('/api/queue/stats').then(r=>r.json())]);
    renderQueueStats(stats);renderQueueList(jobs);updateQBadge(stats);
  }catch(_){}
}

function renderQueueStats(stats){
  const el=document.getElementById('queue-stats');
  if(!el) return;
  const defs=[{k:'processing',l:'Läuft',c:'chip--proc'},{k:'pending',l:'Wartend',c:'chip--pend'},{k:'done',l:'Fertig',c:'chip--done'},{k:'error',l:'Fehler',c:'chip--err'}];
  el.innerHTML=defs.filter(d=>(stats[d.k]||0)>0).map(d=>`<span class="chip ${d.c}">${stats[d.k]} ${d.l}</span>`).join('');
}

function renderQueueList(jobs){
  const c=document.getElementById('queue-list');
  if(!c) return;
  if(!jobs.length){
    c.innerHTML='<div class="empty"><span class="mi">hourglass_empty</span><span class="empty__ttl">Warteschlange leer</span></div>';
    return;
  }
  const active=jobs.filter(j=>j.status==='processing'||j.status==='pending');
  const done  =jobs.filter(j=>j.status==='done'||j.status==='error');
  const existing={};
  c.querySelectorAll('.jcard[data-jid]').forEach(el=>{existing[el.dataset.jid]=el});
  const seen=new Set();

  function mkJob(job,target){
    seen.add(String(job.id));
    let el=existing[String(job.id)];
    const isP=job.status==='processing';
    const pct=job.progress_pct||0;
    const lbl=job.progress_label||'';
    const ico={pending:'hourglass_empty',processing:'settings',done:'check_circle',error:'error'};
    if(!el){el=document.createElement('div');el.dataset.jid=job.id;target.appendChild(el)}
    el.className='jcard'+(isP?' jcard--on':'');
    el.innerHTML=`
      <div class="jcard__hdr">
        <div class="jcard__ico"><span class="mi">${ico[job.status]||'help'}</span></div>
        <div class="jcard__title">${escHtml(job.title)} — Teil ${job.part_number}</div>
        <span class="chip chip--${job.status}">${statusLabel(job.status)}</span>
      </div>
      <div class="jcard__meta">${job.code} · ${formatDate(job.created_at)}${job.started_at?` · ⏱ ${getDuration(job.started_at,job.finished_at)}`:''}</div>
      ${isP?`<div class="jcard__bar"><div class="jcard__track"><div class="jcard__fill" style="width:${pct}%"></div></div><span class="jcard__pct">${pct}%</span></div>${lbl?`<div class="jcard__plbl">${escHtml(lbl)}</div>`:''}`:
        (job.status==='done'&&lbl)?`<div class="jcard__plbl" style="color:var(--cg)">${escHtml(lbl)}</div>`:''}
      ${job.status==='error'?`<div class="jcard__err">${escHtml(job.error_msg||'Fehler')}</div>`:''}
      ${!isP?`<div class="jcard__acts">
        ${job.status==='pending'?`<button class="btn btn--outlined btn--sm" onclick="cancelJob(${job.id})"><span class="mi">cancel</span>Abbrechen</button>`:''}
        ${(job.status==='error'||job.status==='done')?`<button class="btn btn--tonal btn--sm" onclick="restartJob(${job.id})"><span class="mi">refresh</span>Neustart</button>`:''}
        <button class="btn btn--danger btn--sm" onclick="deleteJob(${job.id})"><span class="mi">delete</span>Löschen</button>
      </div>`:''}`;
  }

  c.innerHTML='';
  const aw=document.createElement('div');
  active.forEach(j=>mkJob(j,aw));
  if(active.length) c.appendChild(aw);

  if(done.length){
    const key='sara_qdone';
    const col=localStorage.getItem(key)==='true';
    const sep=document.createElement('div');
    sep.className='csep';
    sep.innerHTML=`<div class="csep__line"></div><span class="csep__txt"><span class="mi csep__ico${col?' col':''}">expand_more</span>Abgeschlossen (${done.length})</span><div class="csep__line"></div>`;
    const dw=document.createElement('div');
    dw.style.display=col?'none':'block';
    sep.onclick=()=>{
      const h=dw.style.display==='none';
      dw.style.display=h?'block':'none';
      sep.querySelector('.csep__ico').classList.toggle('col',!h);
      localStorage.setItem(key,!h);
    };
    done.forEach(j=>mkJob(j,dw));
    c.appendChild(sep);c.appendChild(dw);
  }
  Object.entries(existing).forEach(([id,el])=>{if(!seen.has(id))el.remove()});
}

function updateQBadge(stats){
  const proc=stats['processing']||0, pend=stats['pending']||0;
  let txt='Bereit',live=false;
  if(proc>0){txt=`${proc} läuft`;live=true}
  else if(pend>0){txt=`${pend} wartend`;live=true}
  ['rail-qdot','top-qdot'].forEach(id=>{const d=document.getElementById(id);if(d)d.className='qdot'+(live?' live':'')});
  ['rail-qtxt','top-qtxt'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=txt});
}

async function cancelJob(id){try{const r=await fetch(`/api/queue/${id}/cancel`,{method:'POST'});const j=await r.json();showSnack(j.success?'Abgebrochen':j.error||'Fehler',j.success?'success':'error');loadQueue()}catch{showSnack('Netzwerkfehler','error')}}
async function restartJob(id){try{const r=await fetch(`/api/queue/${id}/restart`,{method:'POST'});const j=await r.json();showSnack(j.success?'Neugestartet':j.error||'Fehler',j.success?'success':'error');loadQueue()}catch{showSnack('Netzwerkfehler','error')}}
async function deleteJob(id){if(!await showConfirm('Aufgabe löschen','Diese Aufgabe aus der Warteschlange entfernen?',{confirmLabel:'Löschen',destructive:true}))return;try{const r=await fetch(`/api/queue/${id}`,{method:'DELETE'});const j=await r.json();showSnack(j.success?'Gelöscht':j.error||'Fehler',j.success?'success':'error');loadQueue()}catch{showSnack('Netzwerkfehler','error')}}

/* ── Confirm Dialog ──────────────────────────────────────── */
let _cdlgResolve=null;
function showConfirm(title,msg,{confirmLabel='Bestätigen',cancelLabel='Abbrechen',destructive=false}={}){
  return new Promise(resolve=>{
    _cdlgResolve=resolve;
    document.getElementById('cdlg-title').textContent=title;
    document.getElementById('cdlg-msg').textContent=msg;
    const ok=document.getElementById('cdlg-ok');
    ok.textContent=confirmLabel;
    ok.style.cssText=destructive?'background:var(--ce);color:#fff':'';
    document.getElementById('cdlg-cancel').textContent=cancelLabel;
    const ico=document.getElementById('cdlg-ico');
    ico.className='cdlg__ico '+(destructive?'cdlg__ico--warn':'cdlg__ico--info');
    ico.innerHTML=`<span class="mi">${destructive?'delete':'help'}</span>`;
    document.getElementById('confirm-modal').classList.add('open');
  });
}
function _cdlgClose(result){
  document.getElementById('confirm-modal').classList.remove('open');
  if(_cdlgResolve){_cdlgResolve(result);_cdlgResolve=null}
}

/* ── Modal ───────────────────────────────────────────────── */
function openVideoModal(src,title){
  document.getElementById('modal-title').textContent=title;
  const v=document.getElementById('modal-video');
  v.title=title;v.src=src;v.load();
  document.getElementById('video-modal').classList.add('open');
}
function closeModal(){
  document.getElementById('video-modal').classList.remove('open');
  const v=document.getElementById('modal-video');
  v.pause();v.src='';
}

/* ── Init ────────────────────────────────────────────────── */
(function(){
  const p=location.pathname;
  let tab='story';
  if(p.startsWith('/video'))  tab='video';
  else if(p.startsWith('/library')){
    tab='library';
    const code=p.split('/library/')[1];
    if(code) pendingLibraryCode=code;
  }
  else if(p.startsWith('/upload')) tab='upload';
  window.addEventListener('popstate',e=>switchTab(e.state?.tab||'story',false));
  switchTab(tab,false);
  startSSE();
})();
</script>
</body>
</html>
