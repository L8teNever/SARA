<!DOCTYPE html>
<html lang="de">
<head>
  <meta name="cf-worker-bypass" content="true" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>SARA</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
/* ── Material You Dark Tokens ─────────────────────────────── */
:root {
  --cp:  #D0BCFF; --cop:  #381E72;
  --cpc: #4F378B; --copc: #EADDFF;
  --csc: #3B384E; --cosc: #E8DEF8;
  --cs:  #0F1015;
  --cs0: #181920;
  --cs1: #20222C;
  --cs2: #2B2D3A;
  --cs3: #363848;
  --cos:  #E6E1E5;
  --cosv: #CAC4D0;
  --co:   #938F99;
  --cov:  #49454F;
  --covv: #2E303E;
  --ce: #F2B8B5; --cec: #8C1D18;
  --cg: #6DD58C; --cgc: #0A3818;
  --cw: #FFB951;
  --r1: 8px; --r2: 16px; --r3: 20px; --r4: 28px; --r5: 24px; --rf: 9999px;
  --rail: 220px; --botnav: 72px;
  --e1: 0 1px 2px rgba(0,0,0,.35),0 1px 3px 1px rgba(0,0,0,.2);
  --e2: 0 4px 16px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.25);
  --e3: 0 8px 28px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',Roboto,sans-serif;font-size:14px;line-height:1.5;color:var(--cos);background:var(--cs);-webkit-font-smoothing:antialiased}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
.mi{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:24px;line-height:1;user-select:none;font-style:normal}
.mono{font-family:'JetBrains Mono',monospace}

/* ── App shell ───────────────────────────────────────────── */
/* 100dvh statt (nur) 100vh: auf mobilen Browsern OHNE PWA-Installation
   veraendert sich die sichtbare Hoehe, wenn die Adressleiste ein-/ausblendet;
   100vh rechnet immer mit der GROESSTEN moeglichen Hoehe, wodurch am
   unteren Rand fixierte Elemente hinter der Browser-Toolbar verschwinden
   koennen. 100dvh verfolgt die tatsaechlich sichtbare Hoehe live mit. */
.appshell{height:100vh;height:100dvh;position:relative;overflow:hidden}

/* ── Glass floating header ───────────────────────────────── */
/* position:fixed statt normaler Flex-Reihe: der Seiteninhalt scrollt
   dadurch WIRKLICH hinter Header und Bottom-Nav durch (sichtbar durch
   den Weichzeichner), statt dass beide nur fest oben/unten eingerahmten
   Platz belegen. */
.ghead{position:fixed;top:14px;left:16px;right:16px;z-index:40;padding:10px 10px 10px 22px;border-radius:var(--rf);
  background:rgba(32,34,44,.72);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px;box-shadow:var(--e2)}
.ghead__logo{font-size:17px;font-weight:800;letter-spacing:.04em}
.ghead__space{flex:1}
.ghead__badge{display:flex;align-items:center;gap:8px;background:rgba(109,213,140,.14);color:var(--cg);padding:8px 16px;border-radius:var(--rf);font-size:12.5px;font-weight:600;border:1px solid rgba(109,213,140,.22)}
.ghead__badge.is-idle{background:var(--cs2);color:var(--cosv);border-color:transparent}

/* ── Shell row (sidebar + content) ──────────────────────── */
/* padding-top raeumt Platz fuer den fixierten Header frei; Inhalt selbst
   scrollt in .pages darunter und laeuft dabei visuell hinter Header/Nav. */
.shell{height:100%;display:flex;overflow:hidden;padding:86px 16px 16px}
.content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;height:100%}
.pages{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ── Sidebar (desktop) ──────────────────────────────────── */
.rail{width:var(--rail);flex-shrink:0;margin-right:16px;background:var(--cs0);border-radius:var(--r5);
  border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;padding:20px 14px;box-shadow:var(--e1);overflow-y:auto}
.rail__eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--co);padding:0 12px;margin-bottom:12px}
.rail__item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border-radius:var(--rf);
  color:var(--cosv);font-size:13.5px;font-weight:500;transition:background .18s,color .18s;cursor:pointer;margin-bottom:2px}
.rail__item:hover{background:rgba(208,188,255,.08)}
.rail__item.is-active{background:var(--csc);color:var(--cosc)}
.rail__item .mi{font-size:21px;flex-shrink:0}
.rail__item.is-active .mi{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.rail__queue{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r3);background:var(--cs1);font-size:11.5px;color:var(--cosv);flex-shrink:0}

/* ── Bottom nav (mobile) — floating pill, ueberlagert Inhalt ────── */
.botnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.botnav__pill{display:flex;align-items:center;gap:2px;background:rgba(32,34,44,.82);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(255,255,255,.07);border-radius:var(--rf);padding:6px;box-shadow:var(--e2)}
.botnav__item{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;color:var(--cosv);transition:background .18s,color .18s}
.botnav__item.is-active{background:var(--cp);color:var(--cop)}
.botnav__item.is-active .mi{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.botnav__item .mi{font-size:22px}

/* ── Queue dot ───────────────────────────────────────────── */
.qdot{width:7px;height:7px;border-radius:50%;background:var(--co);flex-shrink:0}
.qdot.live{background:var(--cg);animation:pulse 1.5s infinite}

/* ── Pages ───────────────────────────────────────────────── */
.page{display:none}
.page.is-active{display:block;animation:pageIn .22s cubic-bezier(.2,0,0,1)}
.wrap{max-width:720px;margin:0 auto;padding:8px 4px 40px}

/* ── Page Header ─────────────────────────────────────────── */
.page-hdr{margin-bottom:20px}
.page-hdr__title{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.page-hdr__sub{font-size:13px;color:var(--cosv);margin-top:4px}

/* ── Cards ───────────────────────────────────────────────── */
.card{background:var(--cs1);border-radius:var(--r5);padding:22px;margin-bottom:14px;border:1px solid rgba(255,255,255,.05)}
.card:last-child{margin-bottom:0}
.card--el{background:var(--cs0);box-shadow:var(--e1);border:none}
.card--hero{background:linear-gradient(135deg,var(--cpc),#2E2359);color:var(--copc);border:none;box-shadow:var(--e2)}

/* Step cards */
.step-card{background:var(--cs1);border-radius:var(--r5);border:1px solid rgba(255,255,255,.05);overflow:hidden;margin-bottom:14px}
.step-card__hdr{display:flex;align-items:center;gap:14px;padding:18px 22px;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05)}
.step-card__num{width:32px;height:32px;flex-shrink:0;border-radius:var(--rf);background:var(--cpc);color:var(--copc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:-.3px}
.step-card__title{font-size:15px;font-weight:700;line-height:1.2}
.step-card__sub{font-size:12px;color:var(--cosv);margin-top:2px}
.step-card__body{padding:22px}

/* Step connector */
.step-conn{display:flex;align-items:center;justify-content:center;gap:8px;height:36px;color:var(--co);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.step-conn .mi{font-size:18px}

/* ── Status boxes ────────────────────────────────────────── */
.tbox{display:flex;align-items:center;gap:14px;background:var(--cpc);color:var(--copc);border-radius:var(--r3);padding:16px 20px;margin-bottom:14px}
.tbox--surface{background:var(--cs3);color:var(--cos);border:1px solid rgba(255,255,255,.05)}
.tbox--warn{background:rgba(255,185,81,.1);color:var(--cos);border:1px solid rgba(255,185,81,.3)}

/* ── Buttons ─────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 24px;height:42px;border-radius:var(--rf);font-size:14px;font-weight:600;letter-spacing:.01em;transition:filter .15s,background .15s;cursor:pointer;border:none;white-space:nowrap}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn .mi{font-size:18px}
.btn--filled{background:var(--cp);color:var(--cop)}
.btn--filled:hover:not(:disabled){filter:brightness(1.08)}
.btn--tonal{background:var(--csc);color:var(--cosc)}
.btn--tonal:hover:not(:disabled){filter:brightness(1.1)}
.btn--outlined{background:transparent;color:var(--cp);border:1.5px solid var(--cov)}
.btn--outlined:hover:not(:disabled){background:rgba(208,188,255,.08)}
.btn--text{background:transparent;color:var(--cp);padding:0 12px}
.btn--text:hover:not(:disabled){background:rgba(208,188,255,.08)}
.btn--danger{background:transparent;color:var(--ce);padding:0 12px}
.btn--danger:hover:not(:disabled){background:rgba(242,184,181,.08)}
.btn--icon{width:40px;height:40px;padding:0;border-radius:var(--rf);background:transparent;color:var(--cosv)}
.btn--icon:hover{background:rgba(230,225,229,.08);color:var(--cos)}
.btn--lg{height:56px;width:100%;font-size:15px;font-weight:700;border-radius:var(--rf);letter-spacing:.01em}
.btn--sm{height:32px;padding:0 14px;font-size:12px}
.btn--sm .mi{font-size:15px}
.btn--ok{background:var(--cgc);color:var(--cg);border:1.5px solid rgba(109,213,140,.25)}
.btn--ok:hover:not(:disabled){filter:brightness(1.1)}

/* ── Form ────────────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.flabel{font-size:11px;font-weight:700;color:var(--cosv);letter-spacing:.08em;text-transform:uppercase}
.inp{width:100%;height:50px;padding:0 16px;background:var(--cs2);border:1.5px solid transparent;border-radius:var(--r2);color:var(--cos);font-size:15px;outline:none;transition:border-color .2s,background .2s}
.inp:focus{border-color:var(--cp);background:var(--cs3)}
.inp::placeholder{color:var(--co)}
.ta{width:100%;padding:14px 16px;background:var(--cs2);border:1.5px solid transparent;border-radius:var(--r2);color:var(--cos);font-size:14px;resize:vertical;outline:none;transition:border-color .2s,background .2s;line-height:1.6}
.ta:focus{border-color:var(--cp);background:var(--cs3)}
.ta::placeholder{color:var(--co)}

/* ── List items ──────────────────────────────────────────── */
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r3);cursor:pointer;border:1.5px solid transparent;transition:background .15s,border-color .15s;margin-bottom:6px}
.li:hover{background:var(--cs2)}
.li.is-sel{background:var(--csc);border-color:var(--cp);color:var(--cosc)}
.li.is-sel:hover{background:var(--csc)}
.li.is-dim{opacity:.4;filter:saturate(.4)}
.li.is-dim:hover{opacity:.6}
.li__lead{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:18px}
.li__body{flex:1;min-width:0}
.li__title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li__sub{font-size:11.5px;color:var(--cosv);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li__trail{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* ── Status dot ──────────────────────────────────────────── */
.sdot{width:8px;height:8px;border-radius:50%;background:var(--co);flex-shrink:0}
.sdot--on{background:var(--cp);animation:pulse 1.5s infinite}
.sdot--ok{background:var(--cg)}

/* ── Chips ───────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:var(--rf);font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
.chip--pend{background:var(--cs3);color:var(--cosv)}
.chip--proc{background:var(--cpc);color:var(--copc)}
.chip--done{background:var(--cgc);color:var(--cg)}
.chip--err{background:var(--cec);color:var(--ce)}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--rf);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid var(--cov);background:transparent;color:var(--cosv);transition:background .15s,color .15s,border-color .15s;flex-shrink:0}
.fchip:hover{background:rgba(208,188,255,.08);color:var(--cos)}
.fchip.is-on{background:var(--csc);color:var(--cosc);border-color:transparent}
.fchip .mi{font-size:15px}

/* ── Badge ───────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--rf);background:var(--cs3);color:var(--cosv);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}

/* ── Section label ───────────────────────────────────────── */
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--co);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.lbl:first-child{margin-top:0}
.lbl::after{content:'';flex:1;height:1px;background:var(--covv)}
.lbl .mi{font-size:15px;text-transform:none;letter-spacing:0;opacity:.7;flex-shrink:0}
.lbl--sm{margin:14px 0 6px;font-size:10px}
.divider{height:1px;background:var(--covv);border:none;margin:16px 0}

/* ── Collapse separator ──────────────────────────────────── */
.csep{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:6px 0;margin:4px 0}
.csep__line{flex:1;height:1px;background:var(--covv)}
.csep__txt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cosv);opacity:.7;white-space:nowrap;display:flex;align-items:center;gap:4px}
.csep__ico{font-size:16px !important;transition:transform .2s}
.csep__ico.col{transform:rotate(-90deg)}

/* ── Queue job cards ─────────────────────────────────────── */
.jcard{background:var(--cs1);border-radius:var(--r3);padding:14px 16px;margin-bottom:8px;border:1px solid rgba(255,255,255,.05);transition:border-color .15s}
.jcard--on{border-color:rgba(208,188,255,.35);background:rgba(79,55,139,.14)}
.jcard__hdr{display:flex;align-items:center;gap:8px}
.jcard__ico{color:var(--cosv);display:flex;align-items:center;flex-shrink:0}
.jcard__ico .mi{font-size:18px}
.jcard__title{font-size:13px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jcard__meta{font-size:11px;color:var(--cosv);margin-top:3px}
.jcard__bar{display:flex;align-items:center;gap:8px;margin-top:10px}
.jcard__track{flex:1;height:5px;background:var(--cs2);border-radius:3px;overflow:hidden}
.jcard__fill{height:100%;background:var(--cp);border-radius:3px;transition:width .5s ease}
.jcard__pct{font-size:11px;font-weight:700;color:var(--cp);min-width:28px;text-align:right}
.jcard__plbl{font-size:11px;color:var(--cosv);font-style:italic;margin-top:4px}
.jcard__err{font-size:11px;color:var(--ce);margin-top:4px}
.jcard__acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ── Library rows ────────────────────────────────────────── */
.lrow{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:var(--r3);background:var(--cs1);cursor:pointer;border:1px solid rgba(255,255,255,.05);transition:background .15s,border-color .15s;margin-bottom:8px}
.lrow:hover{background:var(--cs2);border-color:rgba(255,255,255,.08)}
.lrow__info{flex:1;min-width:0}
.lrow__title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow__meta{font-size:12px;color:var(--cosv);margin-top:3px}
.lrow__plat{display:flex;gap:4px;flex-shrink:0}
.li__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.li__head .li__title{flex:1;min-width:0}
.lrow__head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lrow__head .lrow__title{flex:1;min-width:0}
.pdot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:var(--cs2);color:var(--cosv)}
.pdot--ok{background:var(--cpc);color:var(--copc)}

/* ── Video cards (library detail) ───────────────────────── */
.vcard{display:flex;gap:16px;align-items:flex-start;padding:18px;background:var(--cs1);border-radius:var(--r5);margin-bottom:14px;border:1px solid rgba(255,255,255,.05)}
.vcard__thumb{width:72px;aspect-ratio:9/16;border-radius:var(--r2);background:#000;position:relative;overflow:hidden;flex-shrink:0;cursor:pointer}
.vcard__thumb img,.vcard__thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.vcard__thumb video{opacity:0}
.vcard__thumb:hover video{opacity:1}
.vcard__thumb:hover img{opacity:0}
.vcard__pov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.vcard__thumb:hover .vcard__pov{opacity:1}
.vcard__pov .mi{font-size:28px;color:#fff;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.vcard__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.vcard__part{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cp)}
.vcard__ttl{font-size:14px;font-weight:600;line-height:1.35}
.vcard__desc{font-size:12px;color:var(--cosv);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard__tags{font-size:11px;color:var(--cp)}
.vcard__plat{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.vcard__acts{display:flex;gap:5px;flex-wrap:wrap}
.vcard__story{margin-top:4px}
.vcard__story summary{font-size:11px;font-weight:600;color:var(--cosv);letter-spacing:.04em;cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:4px}
.vcard__story summary::before{content:'▶';font-size:9px;transition:transform .18s}
.vcard__story[open] summary::before{transform:rotate(90deg)}
.vcard__stxt{margin-top:8px;font-size:12px;color:var(--cosv);line-height:1.65;white-space:pre-wrap;background:var(--cs0);border-radius:var(--r1);padding:10px 12px;border:1px solid var(--covv)}

/* ── Platform toggle chips ───────────────────────────────── */
.pchip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--rf);font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--cov);background:transparent;color:var(--cosv);transition:background .15s,color .15s,border-color .15s;flex-shrink:0}
.pchip:hover{border-color:var(--co);color:var(--cos)}
.pchip--ok{background:var(--cgc);color:var(--cg);border-color:transparent}
.pchip .mi{font-size:14px}

/* ── Drop zone ───────────────────────────────────────────── */
.dropzone{border:2px dashed var(--cov);border-radius:var(--r5);padding:48px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:20px}
.dropzone:hover,.dropzone--on{border-color:var(--cp);background:rgba(208,188,255,.04)}
.dropzone .mi{font-size:44px;color:var(--cosv)}
.dropzone__ttl{font-size:16px;font-weight:600;margin-top:12px}
.dropzone__hint{font-size:13px;color:var(--cosv);margin-top:6px}

/* ── Background grid ─────────────────────────────────────── */
.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.bgthumb{aspect-ratio:9/16;border-radius:var(--r3);background:var(--cs3);position:relative;overflow:hidden;cursor:pointer}
.bgthumb video{width:100%;height:100%;object-fit:cover}
.bgthumb__ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.15) 60%,transparent 85%);display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px 10px;gap:1px}
.bgthumb__name{font-size:11px;color:#fff;font-weight:600;word-break:break-all;line-height:1.25}
.bgthumb__date{font-size:9.5px;color:rgba(255,255,255,.7)}
.bgthumb__del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:var(--ce);transition:background .15s}
.bgthumb__del:hover{background:rgba(0,0,0,.85)}
.bgthumb__del .mi{font-size:14px}

/* ── Progress ────────────────────────────────────────────── */
.pbar{height:5px;background:var(--cs3);border-radius:3px;overflow:hidden;flex:1}
.pbar__fill{height:100%;background:var(--cp);border-radius:3px;transition:width .3s ease}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0}

/* ── Import result ───────────────────────────────────────── */
.impres{display:none;padding:16px 18px;border-radius:var(--r3);background:var(--cgc);border:1.5px solid rgba(109,213,140,.3);margin-top:16px}
.impres.show{display:block}
.impres__ttl{font-weight:700;color:var(--cg);margin-bottom:4px;font-size:14px}
.impres__body{font-size:13px;color:var(--cosv)}

/* ── Modal ───────────────────────────────────────────────── */
.mback{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:24px}
.mback.open{display:flex}
.modal{background:var(--cs1);border-radius:var(--r4);padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:mIn .28s cubic-bezier(.2,0,0,1);box-shadow:var(--e3);border:1px solid rgba(255,255,255,.06)}
.modal__hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal__ttl{flex:1;font-size:18px;font-weight:700}
.cdlg{max-width:360px;padding:28px}
.cdlg__ico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;margin-bottom:16px}
.cdlg__ico--warn{background:rgba(255,100,80,.15);color:#FF6450}
.cdlg__ico--info{background:var(--cpc);color:var(--copc)}
.cdlg__ttl{font-size:18px;font-weight:700;margin-bottom:10px}
.cdlg__msg{font-size:14px;color:var(--cosv);line-height:1.6;margin-bottom:24px;white-space:pre-wrap}
.cdlg__acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ── Snackbar ────────────────────────────────────────────── */
.snack{background:var(--cs3);color:var(--cos);padding:13px 20px;border-radius:var(--r3);font-size:13px;font-weight:500;pointer-events:auto;box-shadow:var(--e3);animation:snkIn .25s ease;border-left:4px solid transparent;max-width:100%;word-break:break-word}
.snack--error{border-left-color:var(--ce)}
.snack--success{border-left-color:var(--cg)}
.snack--warning{border-left-color:var(--cw)}
.snack.out{animation:snkOut .3s ease forwards}

/* ── Utilities ───────────────────────────────────────────── */
.muted{color:var(--cosv);opacity:.7}
.hidden{display:none !important}
.spinner{width:24px;height:24px;border:2.5px solid var(--cov);border-top-color:var(--cp);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.spinner--sm{width:16px;height:16px;border-width:2px}
.spinner--lg{width:36px;height:36px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:8px;color:var(--cosv)}
.empty .mi{font-size:40px;opacity:.4}
.empty__ttl{font-size:15px;font-weight:600;color:var(--cos)}
.empty__sub{font-size:13px;opacity:.7}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spin{animation:spin 1.5s linear infinite}

/* ── Animations ──────────────────────────────────────────── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes snkIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes snkOut{to{opacity:0;transform:scale(.88)}}
@keyframes mIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:899px){
  .rail{display:none}
  .botnav{display:flex}
  .shell{padding:78px 0 0}
  .wrap{padding:14px 16px calc(14px + var(--botnav) + env(safe-area-inset-bottom))}
  .ghead{top:12px;left:12px;right:12px}
}
@media(min-width:900px){
  .rail{display:flex}
  .botnav{display:none}
}
@media(max-width:599px){
  .inp,.ta{font-size:16px}
  .vcard{flex-direction:column}
  .vcard__thumb{width:100%;aspect-ratio:16/9}
  .page-hdr__title{font-size:19px}
  .ghead__logo{font-size:15px}
  .ghead__badge{padding:7px 13px;font-size:11.5px}
}
/* Kurze Viewports (z.B. Handy im Querformat) -- weniger vertikaler
   Leerraum in Header/Nav, damit fuer den eigentlichen Inhalt mehr
   Platz bleibt statt dass er zusammengequetscht wird */
@media(max-height:430px){
  .ghead{top:8px;padding-top:7px;padding-bottom:7px}
  .shell{padding-top:60px}
  .botnav{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .wrap{padding-top:10px}
  .page-hdr{margin-bottom:14px}
}
/* Sehr breite Fenster: Inhalt bleibt lesbar zentriert, Sidebar darf
   etwas mehr Luft bekommen statt gequetscht am Content zu kleben */
@media(min-width:1400px){
  .rail{margin-right:20px}
}
  </style>
</head>
<body>

<div class="appshell">
  <header class="ghead">
    <span class="ghead__logo">SARA</span>
    <div class="ghead__space"></div>
    <div class="ghead__badge is-idle" id="header-qbadge">
      <div class="qdot" id="top-qdot"></div>
      <span id="top-qtxt">Bereit</span>
    </div>
  </header>

  <div class="shell">
    <nav class="rail">
      <div class="rail__eyebrow">Navigation</div>
      <button class="rail__item nav-btn is-active" data-tab="story" onclick="switchTab('story')">
        <span class="mi">auto_stories</span><span>Story</span>
      </button>
      <button class="rail__item nav-btn" data-tab="video" onclick="switchTab('video')">
        <span class="mi">movie</span><span>Video</span>
      </button>
      <button class="rail__item nav-btn" data-tab="library" onclick="switchTab('library')">
        <span class="mi">video_library</span><span>Videos</span>
      </button>
      <button class="rail__item nav-btn" data-tab="statistik" onclick="switchTab('statistik')">
        <span class="mi">bar_chart</span><span>Statistik</span>
      </button>
      <button class="rail__item nav-btn" data-tab="medien" onclick="switchTab('medien')">
        <span class="mi">perm_media</span><span>Medien &amp; YouTube</span>
      </button>
      <div class="rail__queue">
        <div class="qdot" id="rail-qdot"></div>
        <span id="rail-qtxt">Bereit</span>
      </div>
    </nav>

    <div class="content">
      <div class="pages">
        {% block content %}{% endblock %}
      </div>

      <nav class="botnav">
        <div class="botnav__pill">
          <button class="botnav__item nav-btn is-active" data-tab="story" onclick="switchTab('story')" title="Story">
            <span class="mi">auto_stories</span>
          </button>
          <button class="botnav__item nav-btn" data-tab="video" onclick="switchTab('video')" title="Video">
            <span class="mi">movie</span>
          </button>
          <button class="botnav__item nav-btn" data-tab="library" onclick="switchTab('library')" title="Videos">
            <span class="mi">video_library</span>
          </button>
          <button class="botnav__item nav-btn" data-tab="statistik" onclick="switchTab('statistik')" title="Statistik">
            <span class="mi">bar_chart</span>
          </button>
          <button class="botnav__item nav-btn" data-tab="medien" onclick="switchTab('medien')" title="Medien & YouTube">
            <span class="mi">perm_media</span>
          </button>
        </div>
      </nav>
    </div>
  </div>
</div>

<!-- Video Modal -->
<div class="mback" id="video-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal__hdr">
      <span class="modal__ttl" id="modal-title"></span>
      <button class="btn btn--icon" onclick="closeModal()"><span class="mi">close</span></button>
    </div>
    <video id="modal-video" controls playsinline style="width:100%;border-radius:16px;max-height:70vh;display:block"></video>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="mback" id="confirm-modal" onclick="if(event.target===this)_cdlgClose(false)">
  <div class="modal cdlg">
    <div class="cdlg__ico cdlg__ico--warn" id="cdlg-ico"><span class="mi">warning</span></div>
    <div class="cdlg__ttl" id="cdlg-title"></div>
    <div class="cdlg__msg" id="cdlg-msg"></div>
    <div class="cdlg__acts">
      <button class="btn btn--text btn--sm" id="cdlg-cancel" onclick="_cdlgClose(false)">Abbrechen</button>
      <button class="btn btn--filled btn--sm" id="cdlg-ok" onclick="_cdlgClose(true)">Bestätigen</button>
    </div>
  </div>
</div>

<div id="snack-wrap" style="position:fixed;bottom:calc(96px + var(--botnav));left:50%;transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,90vw)"></div>

<script>
/* ── State ───────────────────────────────────────────────── */
let currentTab = 'story';
let selectedStoryId = null;
let pendingSelectStoryId = null;
let pendingLibraryCode = null;
let _sseSource = null;
let _prodActive = true;
let _prevProcessingCount = 0;

/* ── Utils ───────────────────────────────────────────────── */
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function _parseDbDate(s){
  // SQLite liefert UTC ohne Zeitzonen-Angabe ("YYYY-MM-DD HH:MM:SS") --
  // explizit als UTC kennzeichnen, sonst rechnet der Browser faelschlich
  // mit lokaler Zeit und zeigt alles um die eigene Zeitzonen-Differenz
  // in der Vergangenheit an.
  const iso=String(s).includes('T')?s:String(s).replace(' ','T');
  return new Date(iso.endsWith('Z')?iso:iso+'Z');
}
function formatDate(s){if(!s)return'–';try{return _parseDbDate(s).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return s}}
function formatDateShort(s){if(!s)return'–';try{return _parseDbDate(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}catch{return s}}
function getDuration(a,b){if(!a)return'–';try{const d=Math.round((new Date(b||Date.now())-new Date(a))/1000);if(d<0)return'Pausiert';const m=Math.floor(d/60),s=d%60;return m?`${m}m ${s}s`:`${s}s`}catch{return'–'}}
function statusLabel(s){return{pending:'Wartend',processing:'Läuft…',done:'Fertig',error:'Fehler'}[s]||s}

/* ── Snackbar ────────────────────────────────────────────── */
function showSnack(msg, type=''){
  const w=document.getElementById('snack-wrap');
  const el=document.createElement('div');
  el.className='snack'+(type?' snack--'+type:'');
  el.textContent=msg;
  w.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},4500);
}

/* ── Navigation ──────────────────────────────────────────── */
const TAB_URL={story:'/',video:'/video',library:'/library',statistik:'/statistik',medien:'/medien'};

function switchTab(name, push=true){
  currentTab=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('is-active'));
  const pg=document.querySelector(`.page[data-tab="${name}"]`);
  if(pg) pg.classList.add('is-active');
  document.querySelectorAll('.nav-btn[data-tab]').forEach(el=>{
    el.classList.toggle('is-active', el.dataset.tab===name);
  });
  if(push) history.pushState({tab:name},'',TAB_URL[name]||'/');
  if(name==='story'    && typeof loadRecentStories==='function') loadRecentStories();
  if(name==='video'    && typeof loadStoryList==='function'){loadStoryList();loadQueue();if(typeof loadProdSettings==='function')loadProdSettings();}
  if(name==='library'  && typeof loadLibrary==='function') loadLibrary();
  if(name==='statistik'&& typeof loadStatistik==='function') loadStatistik();
  if(name==='medien'){
    if(typeof loadYoutubeChannels==='function') loadYoutubeChannels();
    if(typeof loadBackgrounds==='function') loadBackgrounds();
  }
}

/* ── SSE / Queue ─────────────────────────────────────────── */
function startSSE(){
  if(_sseSource) return;
  _sseSource=new EventSource('/api/queue/live');
  _sseSource.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.jobs) renderQueueList(d.jobs);
      if(d.stats){
        renderQueueStats(d.stats);
        updateQBadge(d.stats);
      } else if (d.jobs) {
        const s = {pending:0, processing:0, done:0, error:0};
        d.jobs.forEach(j => { if(s[j.status]!==undefined) s[j.status]++ });
        renderQueueStats(s);
        updateQBadge(s);
      }
      if(typeof d.prod_active!=='undefined'){_prodActive=d.prod_active;if(typeof updateProdBtn==='function')updateProdBtn()}
      const nowProc=d.stats?.processing??(d.jobs?.filter(j=>j.status==='processing').length||0);
      if(_prevProcessingCount>0&&nowProc<_prevProcessingCount){
        if(currentTab==='video'&&typeof loadStoryList==='function') loadStoryList();
        if(currentTab==='story'&&typeof loadRecentStories==='function') loadRecentStories();
        if(currentTab==='library'&&typeof loadLibrary==='function') loadLibrary();
      }
      _prevProcessingCount=nowProc;
    }catch(_){}
  };
  _sseSource.onerror=()=>{
    const el=document.getElementById('sse-status');
    if(el) el.textContent='⚠';
    _sseSource.close();_sseSource=null;
    setTimeout(startSSE,3000);
  };
}

async function loadQueue(){
  try{
    const [jobs,stats]=await Promise.all([fetch('/api/queue').then(r=>r.json()),fetch('/api/queue/stats').then(r=>r.json())]);
    renderQueueStats(stats);renderQueueList(jobs);updateQBadge(stats);
  }catch(_){}
}

function renderQueueStats(stats){
  const el=document.getElementById('queue-stats');
  if(!el) return;
  const defs=[{k:'processing',l:'Läuft',c:'chip--proc'},{k:'pending',l:'Wartend',c:'chip--pend'},{k:'done',l:'Fertig',c:'chip--done'},{k:'error',l:'Fehler',c:'chip--err'}];
  el.innerHTML=defs.filter(d=>(stats[d.k]||0)>0).map(d=>`<span class="chip ${d.c}">${stats[d.k]} ${d.l}</span>`).join('');
}

function renderQueueList(jobs){
  const c=document.getElementById('queue-list');
  if(!c) return;
  if(!jobs.length){
    c.innerHTML='<div class="empty"><span class="mi">hourglass_empty</span><span class="empty__ttl">Warteschlange leer</span></div>';
    return;
  }
  const activeJobs = jobs.filter(j=>j.status==='processing'||j.status==='pending');
  const doneJobs   = jobs.filter(j=>j.status==='done'||j.status==='error');

  function getJobHtml(job){
    const isP=job.status==='processing';
    const pct=job.progress_pct||0;
    const lbl=job.progress_label||'';
    const ico={pending:'hourglass_empty',processing:'settings',done:'check_circle',error:'error'};
    return `
      <div class="jcard${isP?' jcard--on':''}" data-jid="${job.id}">
        <div class="jcard__hdr">
          <div class="jcard__ico"><span class="mi ${isP?'spin':''}">${ico[job.status]||'help'}</span></div>
          <div class="jcard__title">${escHtml(job.title)} — Teil ${job.part_number}</div>
          <span class="badge">${job.code}</span>
          <span class="chip chip--${job.status}">${statusLabel(job.status)}</span>
        </div>
        <div class="jcard__meta">${formatDate(job.created_at)}${job.started_at?` · ⏱ ${getDuration(job.started_at,job.finished_at)}`:''}</div>
        ${isP?`<div class="jcard__bar"><div class="jcard__track"><div class="jcard__fill" style="width:${pct}%"></div></div><span class="jcard__pct">${pct}%</span></div>${lbl?`<div class="jcard__plbl">${escHtml(lbl)}</div>`:''}`:
          (job.status==='done'&&lbl)?`<div class="jcard__plbl" style="color:var(--cg)">${escHtml(lbl)}</div>`:''}
        ${job.status==='error'?`<div class="jcard__err">${escHtml(job.error_msg||'Fehler')}</div>`:''}
        ${!isP?`<div class="jcard__acts">
          ${job.status==='pending'?`<button class="btn btn--outlined btn--sm" onclick="cancelJob(${job.id})"><span class="mi">cancel</span>Abbrechen</button>`:''}
          ${(job.status==='error'||job.status==='done')?`<button class="btn btn--tonal btn--sm" onclick="restartJob(${job.id})"><span class="mi">refresh</span>Neustart</button>`:''}
          <button class="btn btn--danger btn--sm" onclick="deleteJob(${job.id})"><span class="mi">delete</span>Löschen</button>
        </div>`:''}
      </div>`;
  }

  let html = '<div class="queue-active-wrap">';
  activeJobs.forEach(j => html += getJobHtml(j));
  html += '</div>';

  if(doneJobs.length){
    const key='sara_qdone';
    const col=localStorage.getItem(key)==='true';
    html += `
      <div class="csep" onclick="toggleQueueDone(this)">
        <div class="csep__line"></div>
        <span class="csep__txt"><span class="mi csep__ico${col?' col':''}">expand_more</span>Abgeschlossen (${doneJobs.length})</span>
        <div class="csep__line"></div>
      </div>
      <div class="queue-done-wrap" style="display:${col?'none':'block'}">
        ${doneJobs.map(j => getJobHtml(j)).join('')}
      </div>`;
  }

  if (c.dataset.lastHtml !== html) {
    c.innerHTML = html;
    c.dataset.lastHtml = html;
  }
}

function toggleQueueDone(sep){
  const dw = sep.nextElementSibling;
  const h = dw.style.display==='none';
  dw.style.display = h?'block':'none';
  sep.querySelector('.csep__ico').classList.toggle('col', !h);
  localStorage.setItem('sara_qdone', !h);
}

function updateQBadge(stats){
  const proc=stats['processing']||0, pend=stats['pending']||0;
  let txt='Bereit',live=false;
  if(proc>0){txt=`${proc} läuft`;live=true}
  else if(pend>0){txt=`${pend} wartend`;live=true}
  ['rail-qdot','top-qdot'].forEach(id=>{const d=document.getElementById(id);if(d)d.className='qdot'+(live?' live':'')});
  ['rail-qtxt','top-qtxt'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=txt});
  const badge=document.getElementById('header-qbadge');
  if(badge) badge.classList.toggle('is-idle', !live);
}

async function cancelJob(id){try{const r=await fetch(`/api/queue/${id}/cancel`,{method:'POST'});const j=await r.json();showSnack(j.success?'Abgebrochen':j.error||'Fehler',j.success?'success':'error');loadQueue()}catch{showSnack('Netzwerkfehler','error')}}
async function restartJob(id){try{const r=await fetch(`/api/queue/${id}/restart`,{method:'POST'});const j=await r.json();showSnack(j.success?'Neugestartet':j.error||'Fehler',j.success?'success':'error');loadQueue()}catch{showSnack('Netzwerkfehler','error')}}
async function deleteJob(id){if(!await showConfirm('Aufgabe löschen','Diese Aufgabe aus der Warteschlange entfernen?',{confirmLabel:'Löschen',destructive:true}))return;try{const r=await fetch(`/api/queue/${id}`,{method:'DELETE'});const j=await r.json();showSnack(j.success?'Gelöscht':j.error||'Fehler',j.success?'success':'error');loadQueue()}catch{showSnack('Netzwerkfehler','error')}}

/* ── Confirm Dialog ──────────────────────────────────────── */
let _cdlgResolve=null;
function showConfirm(title,msg,{confirmLabel='Bestätigen',cancelLabel='Abbrechen',destructive=false}={}){
  return new Promise(resolve=>{
    _cdlgResolve=resolve;
    document.getElementById('cdlg-title').textContent=title;
    document.getElementById('cdlg-msg').textContent=msg;
    const ok=document.getElementById('cdlg-ok');
    ok.textContent=confirmLabel;
    ok.style.cssText=destructive?'background:var(--ce);color:#fff':'';
    document.getElementById('cdlg-cancel').textContent=cancelLabel;
    const ico=document.getElementById('cdlg-ico');
    ico.className='cdlg__ico '+(destructive?'cdlg__ico--warn':'cdlg__ico--info');
    ico.innerHTML=`<span class="mi">${destructive?'delete':'help'}</span>`;
    document.getElementById('confirm-modal').classList.add('open');
  });
}
function _cdlgClose(result){
  document.getElementById('confirm-modal').classList.remove('open');
  if(_cdlgResolve){_cdlgResolve(result);_cdlgResolve=null}
}

/* ── Modal ───────────────────────────────────────────────── */
function openVideoModal(src,title){
  document.getElementById('modal-title').textContent=title;
  const v=document.getElementById('modal-video');
  v.title=title;v.src=src;v.load();
  document.getElementById('video-modal').classList.add('open');
}
function closeModal(){
  document.getElementById('video-modal').classList.remove('open');
  const v=document.getElementById('modal-video');
  v.pause();v.src='';
}

/* ── Init ────────────────────────────────────────────────── */
(function(){
  const p=location.pathname;
  let tab='story';
  let pendingVideoSettings=false;
  let pendingMedienBackgrounds=false;
  if(p.startsWith('/video')){
    tab='video';
    if(p.startsWith('/video/einstellungen')) pendingVideoSettings=true;
  }
  else if(p.startsWith('/library')){
    tab='library';
    const code=p.split('/library/')[1];
    if(code) pendingLibraryCode=code;
  }
  else if(p.startsWith('/statistik')) tab='statistik';
  else if(p.startsWith('/medien') || p.startsWith('/upload') || p.startsWith('/channels')){
    tab='medien';
    if(p.startsWith('/medien/hintergrund')) pendingMedienBackgrounds=true;
  }
  window.addEventListener('popstate',e=>switchTab(e.state?.tab||'story',false));
  switchTab(tab,false);
  if(pendingVideoSettings && typeof openVideoSettings==='function') openVideoSettings(false);
  if(pendingMedienBackgrounds && typeof openBackgroundsView==='function') openBackgroundsView(false);
  startSSE();
})();
</script>
</body>
</html>
