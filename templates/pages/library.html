<section class="page" data-tab="library">

  <!-- Overview -->
  <div id="lib-overview">
    <div class="wrap">
      <div style="position:sticky;top:0;z-index:10;background:var(--cs);padding-bottom:10px;margin-bottom:2px">
        <div style="position:relative;margin-bottom:10px">
          <span class="mi" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--cosv);pointer-events:none">search</span>
          <input class="inp" id="lib-search" type="text" placeholder="Story suchen…" oninput="filterLibrary()" style="padding-left:42px">
        </div>
        <div class="row" id="lib-filter-chips" style="gap:6px">
          <button class="fchip is-on" data-f="all" onclick="setLibFilter('all',this)"><span class="mi">layers</span> Alle</button>
          <button class="fchip" data-f="no-t1" onclick="setLibFilter('no-t1',this)"><span class="mi">play_circle</span> Kein TikTok 1</button>
          <button class="fchip" data-f="no-t2" onclick="setLibFilter('no-t2',this)"><span class="mi">play_circle</span> Kein TikTok 2</button>
        </div>
      </div>
      <div id="lib-story-list">
        <div class="empty"><span class="mi">videocam_off</span><span class="empty__ttl">Noch keine Videos</span><span class="empty__sub">Erstelle Videos im Video-Tab</span></div>
      </div>
    </div>
  </div>

  <!-- Detail -->
  <div id="lib-detail" style="display:none">
    <div class="wrap">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px">
        <button class="btn btn--tonal btn--sm" onclick="closeLibDetail()">
          <span class="mi">arrow_back</span> Zurück
        </button>
        <span class="badge" id="lib-detail-code"></span>
        <span style="font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="lib-detail-title"></span>
        <span style="font-size:12px;color:var(--cosv)" id="lib-detail-date"></span>
        <button class="btn btn--outlined btn--sm" id="lib-mark-all-btn" style="display:none">
          <span class="mi">done_all</span> Alle erledigt
        </button>
      </div>
      <div id="lib-parts-grid"></div>
    </div>
  </div>

</section>

<script>
let _libData=[];
let _libFilter='all';

async function loadLibrary(){
  const c=document.getElementById('lib-story-list');
  c.innerHTML='<div style="display:flex;justify-content:center;padding:40px"><div class="spinner spinner--lg"></div></div>';
  try{
    _libData=await fetch('/api/videos').then(r=>r.json());
    renderLibraryList();
    if(pendingLibraryCode){
      const s=_libData.find(x=>x.code===pendingLibraryCode);
      if(s){pendingLibraryCode=null;openLibDetail(s,false)}
    }
  }catch(e){c.innerHTML=`<div class="empty"><span class="empty__sub">Fehler: ${e.message}</span></div>`}
}

function setLibFilter(f,el){
  _libFilter=f;
  document.querySelectorAll('#lib-filter-chips .fchip').forEach(c=>c.classList.remove('is-on'));
  el.classList.add('is-on');
  renderLibraryList();
}
function filterLibrary(){renderLibraryList()}

function _matches(story){
  if(_libFilter==='all') return true;
  return story.parts.some(p=>{
    const u=p.uploads||[];
    if(_libFilter==='no-t1') return !u.find(x=>x.platform==='tiktok1');
    if(_libFilter==='no-t2') return !u.find(x=>x.platform==='tiktok2');
    return true;
  });
}

function renderLibraryList(){
  const c=document.getElementById('lib-story-list');
  const q=(document.getElementById('lib-search').value||'').toLowerCase().trim();
  const filtered=_libData.filter(s=>(!q||s.title.toLowerCase().includes(q)||s.code.toLowerCase().includes(q))&&_matches(s));
  if(!filtered.length){
    c.innerHTML=`<div class="empty"><span class="mi">search_off</span><span class="empty__ttl">${_libData.length?'Keine Treffer':'Noch keine Videos'}</span></div>`;
    return;
  }
  c.innerHTML='';
  filtered.forEach(story=>{
    const ups=story.parts.flatMap(p=>p.uploads||[]);
    const hasT1=ups.some(u=>u.platform==='tiktok1');
    const hasT2=ups.some(u=>u.platform==='tiktok2');
    const allDone=story.parts.length>0&&story.parts.every(p=>
      ['tiktok1','tiktok2'].every(pl=>(p.uploads||[]).some(u=>u.platform===pl))
    );
    const row=document.createElement('div');
    row.className='lrow'+(allDone?' lrow--done':'');
    row.innerHTML=`
      <div class="lrow__info">
        <div class="lrow__title">${escHtml(story.title)}</div>
        <div class="lrow__meta"><span class="badge">${story.code}</span>&nbsp;·&nbsp;${story.parts.length} Teil(e) · ${formatDate(story.created_at)}</div>
      </div>
      <div class="lrow__plat">
        <div class="pdot${hasT1?' pdot--ok':''}" title="TikTok 1">T1</div>
        <div class="pdot${hasT2?' pdot--ok':''}" title="TikTok 2">T2</div>
      </div>
      <button class="btn btn--icon lrow__check" title="${allDone?'Erledigt':'Alle als hochgeladen markieren'}" style="color:${allDone?'var(--cg)':'var(--cosv)'}">
        <span class="mi">${allDone?'check_circle':'radio_button_unchecked'}</span>
      </button>
      <button class="btn btn--icon lrow__del" style="color:var(--ce)">
        <span class="mi">delete</span>
      </button>
      <span class="mi" style="color:var(--cosv)">chevron_right</span>`;
    row.querySelector('.lrow__check').addEventListener('click',e=>{
      e.stopPropagation();
      if(!allDone) quickMarkAll(story,row);
    });
    row.querySelector('.lrow__del').addEventListener('click',e=>{
      e.stopPropagation();
      deleteLibStory(story.story_id,story.title);
    });
    row.addEventListener('click',()=>openLibDetail(story));
    c.appendChild(row);
  });
}

function openLibDetail(story,push=true){
  document.getElementById('lib-overview').style.display='none';
  document.getElementById('lib-detail').style.display='block';
  if(push) history.pushState({tab:'library',code:story.code},'',`/library/${story.code}`);
  document.getElementById('lib-detail-code').textContent=story.code;
  document.getElementById('lib-detail-title').textContent=story.title;
  document.getElementById('lib-detail-date').textContent=formatDate(story.created_at);
  const mb=document.getElementById('lib-mark-all-btn');
  mb.style.display='';mb.onclick=()=>markAllUploaded(story);
  const grid=document.getElementById('lib-parts-grid');
  grid.innerHTML='';
  story.parts.forEach(part=>{
    const social=part.social||{};
    const card=document.createElement('div');
    card.className='vcard';card.id='lib-card-'+part.id;
    card.innerHTML=`
      <div class="vcard__thumb" onclick="openVideoModal('/video/${part.video_path}','${escHtml(social.video_title||story.title+' — Teil '+part.part_number)}')">
        ${part.cover_path?`<img src="/covers/${part.cover_path.split('/').pop()}" alt="Cover" loading="lazy">`:''}
        <video src="/video/${part.video_path}" preload="metadata" muted style="opacity:0"></video>
        <div class="vcard__pov"><span class="mi">play_circle</span></div>
      </div>
      <div class="vcard__body">
        <div class="vcard__part">Teil ${part.part_number}</div>
        ${social.video_title?`<div class="vcard__ttl">${escHtml(social.video_title)}</div>`:''}
        ${social.description?`<div class="vcard__desc">${escHtml(social.description)}</div>`:''}
        ${social.hashtags?`<div class="vcard__tags">${escHtml(social.hashtags)}</div>`:''}
        <div class="vcard__plat" id="plat-${part.id}"></div>
        <div class="vcard__acts">
          <button class="btn btn--tonal btn--sm" onclick="openVideoModal('/video/${part.video_path}','${escHtml(story.title)} — Teil ${part.part_number}')">
            <span class="mi" style="font-size:15px">play_arrow</span> Play
          </button>
          <a class="btn btn--outlined btn--sm" href="/download/${part.video_path}" download title="Video">
            <span class="mi" style="font-size:15px">download</span>
          </a>
          ${part.cover_path?`<a class="btn btn--outlined btn--sm" href="/covers/${part.cover_path.split('/').pop()}" download title="Cover"><span class="mi" style="font-size:15px">image</span></a>`:''}
          <button class="btn btn--outlined btn--sm" onclick="copySocial(${part.id})" title="Caption kopieren">
            <span class="mi" style="font-size:15px">content_copy</span>
          </button>
          <button class="btn btn--outlined btn--sm" style="color:var(--ce);border-color:var(--ce)" onclick="deleteLibVideo(${part.id})">
            <span class="mi" style="font-size:15px">delete</span>
          </button>
        </div>
      </div>`;
    const vid=card.querySelector('video');
    const thumb=card.querySelector('.vcard__thumb');
    thumb.addEventListener('mouseenter',()=>{vid.style.opacity='1';vid.play().catch(()=>{})});
    thumb.addEventListener('mouseleave',()=>{vid.style.opacity='0';vid.pause();vid.currentTime=0});
    grid.appendChild(card);
    renderPlatChips(part.id,part.uploads||[]);
    card.dataset.social=JSON.stringify(social);
  });
}

function closeLibDetail(push=true){
  document.getElementById('lib-detail').style.display='none';
  document.getElementById('lib-overview').style.display='block';
  if(push) history.pushState({tab:'library'},'','/library');
}

function renderPlatChips(partId,uploads){
  const c=document.getElementById('plat-'+partId);
  if(!c) return;
  const plats=[{id:'tiktok1',l:'TikTok 1',i:'play_circle'},{id:'tiktok2',l:'TikTok 2',i:'play_circle'}];
  c.innerHTML='';
  plats.forEach(p=>{
    const ex=uploads.find(u=>u.platform===p.id);
    const btn=document.createElement('button');
    btn.className='pchip'+(ex?' pchip--ok':'');
    btn.title=ex?`Hochgeladen ${formatDateShort(ex.uploaded_at)} — Klicken zum Entfernen`:`Als ${p.l} markieren`;
    btn.innerHTML=`<span class="mi">${ex?'check_circle':p.i}</span>${p.l}${ex?` · ${formatDateShort(ex.uploaded_at)}`:''}`;
    btn.addEventListener('click',()=>toggleUpload(partId,p.id,ex?ex.id:null));
    c.appendChild(btn);
  });
}

async function toggleUpload(partId,platform,uploadId){
  try{
    if(uploadId){
      await fetch(`/api/uploads/${uploadId}`,{method:'DELETE'});
      showSnack(`${platform} entfernt.`,'success');
    }else{
      const res=await fetch('/api/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_part_id:partId,platform})});
      const d=await res.json();
      if(d.error){showSnack(d.error,'error');return}
      showSnack(`Als ${platform} markiert!`,'success');
    }
    await loadLibrary();
    const story=_libData.find(s=>s.parts.some(p=>p.id===partId));
    if(story){const part=story.parts.find(p=>p.id===partId);if(part) renderPlatChips(partId,part.uploads||[])}
  }catch(e){showSnack('Fehler: '+e.message,'error')}
}

function copySocial(partId){
  const card=document.getElementById('lib-card-'+partId);
  if(!card) return;
  let s={};try{s=JSON.parse(card.dataset.social||'{}')}catch(_){}
  const t=[s.video_title,'',s.description,'',s.hashtags].filter(x=>x!=null).join('\n').trim();
  navigator.clipboard.writeText(t).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()});
  showSnack('Caption kopiert!','success');
}

async function deleteLibVideo(partId){
  if(!await showConfirm('Video löschen','Dieses Video wirklich löschen?',{confirmLabel:'Löschen',destructive:true}))return;
  try{
    const res=await fetch(`/api/videos/${partId}`,{method:'DELETE'});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');return}
    showSnack('Video gelöscht.','success');
    await loadLibrary();
    const story=_libData.find(s=>s.parts.some(p=>p.id===partId));
    if(story&&story.parts.length>1) openLibDetail(story,false);
    else closeLibDetail(false);
  }catch(e){showSnack('Fehler: '+e.message,'error')}
}

async function deleteLibStory(storyId,title){
  if(!await showConfirm('Story löschen',`"${title}" inklusive aller Videos löschen?`,{confirmLabel:'Löschen',destructive:true}))return;
  try{
    const res=await fetch(`/api/stories/${storyId}`,{method:'DELETE'});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');return}
    showSnack('Story gelöscht.','success');
    loadLibrary();
  }catch(e){showSnack('Fehler: '+e.message,'error')}
}

async function markAllUploaded(story){
  if(!await showConfirm('Alle markieren',`Alle Teile von "${story.title}" als hochgeladen markieren?`,{confirmLabel:'Markieren'}))return;
  try{
    for(const part of story.parts){
      for(const p of['tiktok1','tiktok2']){
        if(!(part.uploads||[]).some(u=>u.platform===p)){
          await fetch('/api/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_part_id:part.id,platform:p})});
        }
      }
    }
    showSnack('Alle als erledigt markiert.','success');
    await loadLibrary();
    const updated=_libData.find(s=>s.story_id===story.story_id);
    if(updated) openLibDetail(updated,false);
  }catch(e){showSnack('Fehler: '+e.message,'error')}
}
</script>
