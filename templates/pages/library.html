<section class="page" data-tab="library">

  <!-- Overview -->
  <div id="lib-overview">
    <div class="wrap">

      <div class="page-hdr">
        <div class="page-hdr__title">Videos</div>
        <div class="page-hdr__sub">Fertige Videos verwalten und Upload-Status tracken</div>
      </div>

      <div style="position:sticky;top:0;z-index:10;background:var(--cs);padding-bottom:10px;margin-bottom:2px">
        <div style="position:relative;margin-bottom:10px">
          <span class="mi" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--cosv);pointer-events:none">search</span>
          <input class="inp" id="lib-search" type="text" placeholder="Story suchen…" oninput="filterLibrary()" style="padding-left:44px">
        </div>
        <div class="row" id="lib-filter-chips" style="gap:6px">
          <button class="fchip is-on" data-f="all" onclick="setLibFilter('all',this)"><span class="mi">layers</span> Alle</button>
        </div>
      </div>

      <div id="lib-story-list">
        <div style="display:flex;justify-content:center;padding:40px"><div class="spinner spinner--lg"></div></div>
      </div>
    </div>
  </div>

  <!-- Detail -->
  <div id="lib-detail" style="display:none">
    <div class="wrap">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px">
        <button class="btn btn--tonal btn--sm" onclick="closeLibDetail()">
          <span class="mi">arrow_back</span> Zurück
        </button>
        <span style="font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="lib-detail-title"></span>
        <span style="font-size:12px;color:var(--cosv)" id="lib-detail-date"></span>
        <span class="badge" id="lib-detail-code"></span>
        <button class="btn btn--outlined btn--sm" id="lib-mark-all-btn" style="display:none">
          <span class="mi">done_all</span> Alle erledigt
        </button>
      </div>

      <div class="card--el" style="margin-bottom:18px">
        <div class="flabel" style="margin-bottom:6px">Gesamt-Performance</div>
        <div style="font-size:28px;font-weight:800;color:var(--cg)"><span id="lib-detail-total-views">0</span> <span style="font-size:14px;font-weight:600;color:var(--cosv)">Aufrufe insgesamt</span></div>
      </div>

      <div id="lib-parts-grid"></div>
    </div>
  </div>

</section>

<script>
let _libData=[];
let _libFilter='all';
let _ytAccounts=[];

async function loadLibrary(){
  const c=document.getElementById('lib-story-list');
  c.innerHTML='<div style="display:flex;justify-content:center;padding:40px"><div class="spinner spinner--lg"></div></div>';
  try{
    [_libData,_ytAccounts]=await Promise.all([
      fetch('/api/videos').then(r=>r.json()),
      fetch('/api/youtube/accounts').then(r=>r.json()).catch(()=>[]),
    ]);
    renderLibFilterChips();
    renderLibraryList();
    loadLibraryListStats();
    if(pendingLibraryCode){
      const s=_libData.find(x=>x.code===pendingLibraryCode);
      if(s){pendingLibraryCode=null;openLibDetail(s,false)}
    }
  }catch(e){c.innerHTML=`<div class="empty"><span class="empty__sub">Fehler: ${e.message}</span></div>`}
}

function _ytLabel(i){return `YouTube ${i+1}`}
function _ytPlatform(acc){return `youtube:${acc.id}`}

function renderLibFilterChips(){
  const wrap=document.getElementById('lib-filter-chips');
  const extra=_ytAccounts.map((acc,i)=>
    `<button class="fchip" data-f="no-yt-${acc.id}" onclick="setLibFilter('no-yt-${acc.id}',this)"><span class="mi">smart_display</span> Kein ${_ytLabel(i)}</button>`
  ).join('');
  wrap.innerHTML='<button class="fchip is-on" data-f="all" onclick="setLibFilter(\'all\',this)"><span class="mi">layers</span> Alle</button>'+extra;
}

function setLibFilter(f,el){
  _libFilter=f;
  document.querySelectorAll('#lib-filter-chips .fchip').forEach(c=>c.classList.remove('is-on'));
  el.classList.add('is-on');
  renderLibraryList();
  loadLibraryListStats();
}
function filterLibrary(){renderLibraryList();loadLibraryListStats()}

function _matches(story){
  if(_libFilter==='all') return true;
  if(_libFilter.startsWith('no-yt-')){
    const platform='youtube:'+_libFilter.slice(6);
    return story.parts.some(p=>!(p.uploads||[]).find(x=>x.platform===platform));
  }
  return true;
}

function _storyUploadStatus(story){
  const accStatus=_ytAccounts.map((acc,i)=>{
    const allOk = story.parts.length>0 && story.parts.every(p=>(p.uploads||[]).some(u=>u.platform===_ytPlatform(acc)));
    return {label:`Y${i+1}`, ok:allOk};
  });
  if(!accStatus.length) return {label:'',color:'var(--cosv)',sub:''};
  const allDone=accStatus.every(a=>a.ok);
  const noneDone=accStatus.every(a=>!a.ok);
  if(allDone) return {label:'Gepostet',color:'var(--cg)',sub:accStatus.map(a=>a.label).join(' & ')+' aktiv'};
  if(noneDone) return {label:'Offen',color:'var(--cosv)',sub:accStatus.map(a=>a.label).join(' & ')+' wartend'};
  return {label:'Teilweise',color:'var(--cw)',sub:accStatus.map(a=>`${a.label} ${a.ok?'OK':'Wartend'}`).join(' / ')};
}

function _storyVideoIds(story){
  const ids=[];
  story.parts.forEach(p=>(p.uploads||[]).forEach(u=>{
    if(!u.platform||!u.platform.startsWith('youtube:'))return;
    const m=(u.notes||'').match(/v=([\w-]+)/);
    if(m)ids.push(m[1]);
  }));
  return ids;
}

function renderLibraryList(){
  const c=document.getElementById('lib-story-list');
  const q=(document.getElementById('lib-search').value||'').toLowerCase().trim();
  const filtered=_libData.filter(s=>(!q||s.title.toLowerCase().includes(q)||s.code.toLowerCase().includes(q))&&_matches(s));
  if(!filtered.length){
    c.innerHTML=`<div class="empty"><span class="mi">search_off</span><span class="empty__ttl">${_libData.length?'Keine Treffer':'Noch keine Videos'}</span></div>`;
    return;
  }
  c.innerHTML='';
  filtered.forEach(story=>{
    const status=_storyUploadStatus(story);
    const vids=_storyVideoIds(story);
    const row=document.createElement('div');
    row.className='lrow';
    row.dataset.vids=vids.join(',');
    row.innerHTML=`
      <div class="lrow__info">
        <div class="lrow__head">
          <div class="lrow__title">${escHtml(story.title)}</div>
          <span class="badge">${story.code}</span>
        </div>
        <div class="lrow__meta">${story.parts.length} Teil(e) · ${formatDate(story.created_at)}${vids.length?` · <span data-viewcount style="color:var(--cg);font-weight:700">–</span>`:''}</div>
      </div>
      ${status.label?`<div style="text-align:right;flex-shrink:0">
        <div style="font-size:12px;font-weight:700;color:${status.color}">${status.label}</div>
        <div style="font-size:10.5px;color:var(--cosv);margin-top:1px;white-space:nowrap">${status.sub}</div>
      </div>`:''}
      <button class="btn btn--icon lrow__del" style="color:var(--ce)">
        <span class="mi">delete</span>
      </button>
      <span class="mi" style="color:var(--cosv)">chevron_right</span>`;
    row.querySelector('.lrow__del').addEventListener('click',e=>{
      e.stopPropagation();
      deleteLibStory(story.story_id,story.title,e.currentTarget);
    });
    row.addEventListener('click',()=>openLibDetail(story));
    c.appendChild(row);
  });
}

async function loadLibraryListStats(){
  const idToEls={};
  document.querySelectorAll('.lrow[data-vids]').forEach(row=>{
    const vids=(row.dataset.vids||'').split(',').filter(Boolean);
    const el=row.querySelector('[data-viewcount]');
    if(!vids.length||!el)return;
    vids.forEach(v=>{(idToEls[v]=idToEls[v]||[]).push(el)});
    el.dataset.total='0';
    el.dataset.vids=vids.join(',');
  });
  const ids=Object.keys(idToEls);
  if(!ids.length)return;
  try{
    const stats=await fetch('/api/youtube/stats?video_ids='+ids.join(',')).then(r=>r.json());
    document.querySelectorAll('[data-viewcount]').forEach(el=>{
      const vids=(el.dataset.vids||'').split(',').filter(Boolean);
      let total=0;
      vids.forEach(v=>{if(stats[v])total+=stats[v].views||0});
      el.textContent=total.toLocaleString('de-DE')+' Aufrufe';
    });
  }catch(_){}
}

function openLibDetail(story,push=true){
  document.getElementById('lib-overview').style.display='none';
  document.getElementById('lib-detail').style.display='block';
  if(push) history.pushState({tab:'library',code:story.code},'',`/library/${story.code}`);
  document.getElementById('lib-detail-code').textContent=story.code;
  document.getElementById('lib-detail-title').textContent=story.title;
  document.getElementById('lib-detail-date').textContent=formatDate(story.created_at);
  document.getElementById('lib-detail-total-views').textContent='0';
  const mb=document.getElementById('lib-mark-all-btn');
  mb.style.display='';mb.onclick=()=>markAllUploaded(story,mb);
  const grid=document.getElementById('lib-parts-grid');
  grid.innerHTML='';
  story.parts.forEach(part=>{
    const social=part.social||{};
    const hasUpload=(part.uploads||[]).length>0;
    const card=document.createElement('div');
    card.className='vcard';card.id='lib-card-'+part.id;
    card.innerHTML=`
      <div class="vcard__thumb" onclick="openVideoModal('/video/${part.video_path}','${escHtml(social.video_title||story.title+' — Teil '+part.part_number)}')">
        ${part.cover_path?`<img src="/covers/${part.cover_path.split('/').pop()}" alt="Cover" loading="lazy">`:''}
        <video src="/video/${part.video_path}" preload="metadata" muted style="opacity:0"></video>
        <div class="vcard__pov"><span class="mi">play_circle</span></div>
      </div>
      <div class="vcard__body">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span class="badge" style="background:var(--cpc);color:var(--copc)">TEIL ${part.part_number} VON ${story.parts.length}</span>
          <span class="chip ${hasUpload?'chip--done':'chip--pend'}">${hasUpload?'Gepostet':'Offen'}</span>
        </div>
        ${social.video_title?`<div class="vcard__ttl">${escHtml(social.video_title)}</div>`:''}
        ${social.description?`<div class="vcard__desc">${escHtml(social.description)}</div>`:''}
        ${social.hashtags?`<div class="vcard__tags">${escHtml(social.hashtags)}</div>`:''}
        ${part.text?`<details class="vcard__story"><summary>Story-Text</summary><div class="vcard__stxt">${escHtml(part.text)}</div></details>`:''}
        <div class="vcard__plat" id="plat-${part.id}"></div>
        <div class="vcard__acts">
          <button class="btn btn--tonal btn--sm" onclick="openVideoModal('/video/${part.video_path}','${escHtml(story.title)} — Teil ${part.part_number}')">
            <span class="mi" style="font-size:15px">play_arrow</span> Play
          </button>
          <a class="btn btn--outlined btn--sm" href="/download/${part.video_path}" download title="Video">
            <span class="mi" style="font-size:15px">download</span>
          </a>
          ${part.cover_path?`<a class="btn btn--outlined btn--sm" href="/covers/${part.cover_path.split('/').pop()}" download title="Cover"><span class="mi" style="font-size:15px">image</span></a>`:''}
          <button class="btn btn--outlined btn--sm" onclick="copySocial(${part.id})" title="Caption kopieren">
            <span class="mi" style="font-size:15px">content_copy</span>
          </button>
          <button class="btn btn--outlined btn--sm" style="color:var(--ce);border-color:var(--ce)" onclick="deleteLibVideo(${part.id},this)">
            <span class="mi" style="font-size:15px">delete</span>
          </button>
        </div>
      </div>`;
    const vid=card.querySelector('video');
    const thumb=card.querySelector('.vcard__thumb');
    thumb.addEventListener('mouseenter',()=>{vid.style.opacity='1';vid.play().catch(()=>{})});
    thumb.addEventListener('mouseleave',()=>{vid.style.opacity='0';vid.pause();vid.currentTime=0});
    grid.appendChild(card);
    renderPlatChips(part.id,part.uploads||[]);
    card.dataset.social=JSON.stringify(social);
  });
  loadYtStats(story);
}

function closeLibDetail(push=true){
  document.getElementById('lib-detail').style.display='none';
  document.getElementById('lib-overview').style.display='block';
  if(push) history.pushState({tab:'library'},'','/library');
}

function renderPlatChips(partId,uploads){
  const c=document.getElementById('plat-'+partId);
  if(!c) return;
  const plats=_ytAccounts.map((acc,i)=>({id:_ytPlatform(acc),accId:acc.id,l:_ytLabel(i)}));
  c.innerHTML='';
  plats.forEach(p=>{
    const ex=uploads.find(u=>u.platform===p.id);
    const btn=document.createElement('button');
    if(ex){
      const m=(ex.notes||'').match(/v=([\w-]+)/);
      const vid=m?m[1]:null;
      btn.className='pchip pchip--ok';
      btn.dataset.vid=vid||'';
      btn.title=vid?`Hochgeladen ${formatDateShort(ex.uploaded_at)} — Video öffnen`:`Hochgeladen ${formatDateShort(ex.uploaded_at)}`;
      btn.innerHTML=`<span class="mi">check_circle</span>${p.l} · ${formatDateShort(ex.uploaded_at)}<span data-stat></span>`;
      if(vid) btn.addEventListener('click',()=>window.open(`https://youtube.com/watch?v=${vid}`,'_blank'));
    }else{
      btn.className='pchip';
      btn.title=`Jetzt auf ${p.l} hochladen`;
      btn.innerHTML=`<span class="mi">upload</span>${p.l} hochladen`;
      btn.addEventListener('click',()=>triggerYoutubeUpload(partId,p.accId,btn));
    }
    c.appendChild(btn);
  });
}

async function triggerYoutubeUpload(partId,accountId,btn){
  const oh=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML='<div class="spinner spinner--sm" style="width:12px;height:12px;border-width:2px;margin-right:4px;display:inline-block;vertical-align:-2px"></div>Wird eingereiht…';
  try{
    const res=await fetch('/api/youtube/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_part_id:partId,account_ids:[accountId]})});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');btn.disabled=false;btn.innerHTML=oh;return}
    showSnack('Upload eingereiht — läuft in Kürze automatisch.','success');
    btn.innerHTML='<span class="mi">schedule</span>Eingereiht…';
  }catch(e){showSnack('Fehler: '+e.message,'error');btn.disabled=false;btn.innerHTML=oh}
}

async function loadYtStats(story){
  const ids=_storyVideoIds(story);
  const totalEl=document.getElementById('lib-detail-total-views');
  if(!ids.length){if(totalEl)totalEl.textContent='0';return}
  try{
    const stats=await fetch('/api/youtube/stats?video_ids='+ids.join(',')).then(r=>r.json());
    document.querySelectorAll('.pchip[data-vid]').forEach(btn=>{
      const s=stats[btn.dataset.vid];
      const statEl=btn.querySelector('[data-stat]');
      if(s&&statEl)statEl.textContent=` · ${Number(s.views).toLocaleString('de-DE')} Aufrufe`;
    });
    let total=0;
    ids.forEach(id=>{if(stats[id])total+=stats[id].views||0});
    if(totalEl)totalEl.textContent=total.toLocaleString('de-DE');
  }catch(_){}
}

async function toggleUpload(partId,platform,uploadId,btn){
  const oh=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner spinner--sm" style="margin-right:4px"></div>'+platform}
  try{
    if(uploadId){
      await fetch(`/api/uploads/${uploadId}`,{method:'DELETE'});
      _libDataRemoveUpload(partId,uploadId);
      showSnack(`${platform} entfernt.`,'success');
    }else{
      const res=await fetch('/api/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_part_id:partId,platform})});
      const d=await res.json();
      if(d.error){showSnack(d.error,'error');if(btn){btn.disabled=false;btn.innerHTML=oh}return}
      _libDataAddUpload(partId,{id:d.id,platform,uploaded_at:d.uploaded_at||new Date().toISOString()});
      showSnack(`Als ${platform} markiert!`,'success');
    }
    const story=_libData.find(s=>s.parts.some(p=>p.id===partId));
    if(story){const part=story.parts.find(p=>p.id===partId);if(part) renderPlatChips(partId,part.uploads||[])}
  }catch(e){showSnack('Fehler: '+e.message,'error');if(btn){btn.disabled=false;btn.innerHTML=oh}}
}

function _libDataRemoveUpload(partId,uploadId){
  for(const s of _libData) for(const p of s.parts) if(p.id===partId){p.uploads=(p.uploads||[]).filter(u=>u.id!==uploadId);return}
}
function _libDataAddUpload(partId,upload){
  for(const s of _libData) for(const p of s.parts) if(p.id===partId){(p.uploads=p.uploads||[]).push(upload);return}
}

function copySocial(partId){
  const card=document.getElementById('lib-card-'+partId);
  if(!card) return;
  let s={};try{s=JSON.parse(card.dataset.social||'{}')}catch(_){}
  const t=[s.video_title,'',s.description,'',s.hashtags].filter(x=>x!=null).join('\n').trim();
  navigator.clipboard.writeText(t).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()});
  showSnack('Caption kopiert!','success');
}

async function deleteLibVideo(partId,btn){
  if(!await showConfirm('Video löschen','Dieses Video wirklich löschen?',{confirmLabel:'Löschen',destructive:true}))return;
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner spinner--sm" style="width:14px;height:14px;border-width:2px"></div>'}
  try{
    const res=await fetch(`/api/videos/${partId}`,{method:'DELETE'});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');if(btn){btn.disabled=false;btn.innerHTML='<span class="mi" style="font-size:15px">delete</span>'}return}
    showSnack('Video gelöscht.','success');
    await loadLibrary();
    const story=_libData.find(s=>s.parts.some(p=>p.id===partId));
    if(story&&story.parts.length>1) openLibDetail(story,false);
    else closeLibDetail(false);
  }catch(e){showSnack('Fehler: '+e.message,'error');if(btn){btn.disabled=false;btn.innerHTML='<span class="mi" style="font-size:15px">delete</span>'}}
}

async function deleteLibStory(storyId,title,btn){
  if(!await showConfirm('Story löschen',`"${title}" inklusive aller Videos löschen?`,{confirmLabel:'Löschen',destructive:true}))return;
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner spinner--sm" style="width:14px;height:14px;border-width:2px"></div>'}
  try{
    const res=await fetch(`/api/stories/${storyId}`,{method:'DELETE'});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');if(btn){btn.disabled=false;btn.innerHTML='<span class="mi">delete</span>'}return}
    showSnack('Story gelöscht.','success');
    loadLibrary();
  }catch(e){showSnack('Fehler: '+e.message,'error');if(btn){btn.disabled=false;btn.innerHTML='<span class="mi">delete</span>'}}
}

async function markAllUploaded(story,btn){
  if(!await showConfirm('Alle markieren',`Alle Teile von "${story.title}" als hochgeladen markieren?`,{confirmLabel:'Markieren'}))return;
  const oldHtml=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner spinner--sm" style="width:14px;height:14px;border-width:2px;margin-right:6px"></div> Markiere…'}
  try{
    const jobs=[];
    for(const part of story.parts){
      for(const acc of _ytAccounts){
        const p=_ytPlatform(acc);
        if(!(part.uploads||[]).some(u=>u.platform===p)){
          jobs.push(fetch('/api/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_part_id:part.id,platform:p})}));
        }
      }
    }
    await Promise.all(jobs);
    showSnack('Alle als erledigt markiert.','success');
    await loadLibrary();
    const updated=_libData.find(s=>s.story_id===story.story_id);
    if(updated) openLibDetail(updated,false);
  }catch(e){showSnack('Fehler: '+e.message,'error');if(btn){btn.disabled=false;btn.innerHTML=oldHtml}}
}
</script>
