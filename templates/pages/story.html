<section class="page is-active" data-tab="story">
<div class="wrap">

  <div class="lbl"><span class="mi">looks_one</span> Prompt generieren</div>
  <div class="card">
    <div class="field">
      <label class="flabel" for="story-idea">Thema <span style="font-weight:400;opacity:.6;text-transform:none;letter-spacing:0">(optional — leer = zufällige Story)</span></label>
      <input id="story-idea" class="inp" type="text" placeholder='z.B. "a woman who discovers her husband has a secret family"'>
    </div>
    <button class="btn btn--filled btn--lg" id="btn-copy-full" onclick="copyFullPrompt()" style="margin-top:4px">
      <span class="mi">content_copy</span> Prompt kopieren
    </button>
    <div id="copy-confirm" style="text-align:center;font-size:12px;min-height:18px;margin-top:6px;color:var(--cg)"></div>
    <div style="margin-top:10px">
      <button class="btn btn--text btn--sm" onclick="togglePromptPreview(this)" style="color:var(--cosv)">
        <span class="mi" style="font-size:16px;transition:transform .2s">expand_more</span>
        Prompt anzeigen / bearbeiten
      </button>
      <div id="prompt-preview-wrap" style="display:none;margin-top:10px">
        <textarea id="prompt-template-ta" class="ta" style="font-family:'Courier New',monospace;font-size:12px;min-height:260px;line-height:1.55" spellcheck="false"></textarea>
        <button class="btn btn--outlined btn--sm" onclick="resetPromptTemplate()" style="margin-top:8px">
          <span class="mi">restart_alt</span> Zurücksetzen
        </button>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;margin:6px 0 4px">
    <div class="divider" style="flex:1;margin:0"></div>
    <span style="font-size:12px;color:var(--cosv);white-space:nowrap">In ChatGPT / Gemini / Claude einfügen → Antwort kopieren</span>
    <div class="divider" style="flex:1;margin:0"></div>
  </div>

  <div class="lbl"><span class="mi">looks_two</span> KI-Antwort importieren</div>
  <div class="card">
    <div class="field">
      <label class="flabel" for="import-json">JSON-Antwort</label>
      <textarea id="import-json" class="ta" style="min-height:180px;font-family:'Courier New',monospace;font-size:12.5px"
        placeholder='{
  "title": "The Betrayal",
  "total_parts": 2,
  "keywords": ["betrayal","trust",...],
  "parts": [...]
}'></textarea>
    </div>
    <div class="row">
      <button class="btn btn--filled" onclick="importStory()" style="flex:1">
        <span class="mi">check_circle</span> Story importieren
      </button>
      <button class="btn btn--outlined" onclick="clearImport()">
        <span class="mi">delete_sweep</span> Leeren
      </button>
    </div>
    <div class="impres" id="import-result">
      <div class="impres__ttl" id="import-result-title"></div>
      <div class="impres__body" id="import-result-body"></div>
      <div id="import-result-actions" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
  </div>

  <div class="lbl"><span class="mi">history</span> Zuletzt gespeichert</div>
  <div id="recent-stories-list">
    <div style="display:flex;justify-content:center;padding:24px"><div class="spinner"></div></div>
  </div>

</div>
</section>

<script>
const SARA_DEFAULT_PROMPT=
`You are a creative storyteller specializing in Reddit-style personal stories for TikTok/Reels.
Generate compelling, emotional, and suspenseful stories that feel authentic and real.
Stories must be written in English and follow this EXACT JSON format — no text before or after:
{
  "title": "Story Title",
  "total_parts": <number>,
  "keywords": ["word1","word2","word3","word4","word5","word6","word7","word8","word9","word10"],
  "parts": [
    {
      "part_number": 1,
      "text": "Text of part 1 — MUST be 160 to 200 words...",
      "cliffhanger_hint": "brief hint of what comes next",
      "social": {
        "video_title": "Catchy TikTok/Reels title with Part 1/2 — max 80 chars",
        "description": "2-3 sentence caption that teases the story emotionally without spoiling it. End with a question or call-to-action.",
        "hashtags": "#storytime #reddit #viral #relationship #foryou #fyp #drama"
      }
    },
    {
      "part_number": 2,
      "text": "Text of part 2 — MUST be 160 to 200 words...",
      "cliffhanger_hint": "",
      "social": {
        "video_title": "Catchy TikTok/Reels title with Part 2/2 — max 80 chars",
        "description": "2-3 sentence caption that teases the conclusion. End with a question or call-to-action.",
        "hashtags": "#storytime #reddit #viral #relationship #foryou #fyp #drama"
      }
    }
  ]
}

Rules:
- Each part MUST contain exactly 160–200 words (this guarantees at least 75 seconds of audio per part)
- Split the story so each part has 160–200 words; never fewer than 160 words per part
- Each part (except the last) MUST end at the most dramatic, suspenseful cliffhanger possible
- For 2-part stories: Part 1 MUST end at the single most gripping moment — the listener MUST feel compelled to watch Part 2 immediately
- Last part always has empty string for cliffhanger_hint
- keywords: exactly 10 English keywords describing the core story content
- Write in first person, past tense, raw and emotional style (like r/TIFU or r/relationships)
- Hook the audience within the very first sentence — no slow build-ups
- social.video_title: punchy and attention-grabbing, include "Part X/Y" for multi-part, max 80 chars
- social.description: emotionally tease the story, never spoil the ending, end with a question or CTA
- social.hashtags: 6–8 relevant hashtags as a single space-separated string

Create a story about: [DEIN THEMA HIER EINTRAGEN — oder Zeile so lassen für eine zufällige Story]`;

function initPromptTemplate(){
  const ta=document.getElementById('prompt-template-ta');
  if(ta&&!ta.value) ta.value=SARA_DEFAULT_PROMPT;
}

function togglePromptPreview(btn){
  const wrap=document.getElementById('prompt-preview-wrap');
  const ico=btn.querySelector('.mi');
  const hidden=wrap.style.display==='none';
  wrap.style.display=hidden?'block':'none';
  ico.style.transform=hidden?'rotate(180deg)':'';
  if(hidden) initPromptTemplate();
}

function resetPromptTemplate(){
  document.getElementById('prompt-template-ta').value=SARA_DEFAULT_PROMPT;
  showSnack('Prompt zurückgesetzt.','success');
}

async function copyFullPrompt(){
  const idea=(document.getElementById('story-idea')?.value||'').trim();
  initPromptTemplate();
  let text=document.getElementById('prompt-template-ta').value.trim()||SARA_DEFAULT_PROMPT;
  if(idea) text=text.replace(/Create a story about:.*$/,`Create a story about: ${idea}`);
  const btn=document.getElementById('btn-copy-full');
  const cfm=document.getElementById('copy-confirm');
  try{await navigator.clipboard.writeText(text)}catch(_){
    const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();
  }
  if(btn) btn.innerHTML='<span class="mi">check</span> Kopiert!';
  if(cfm) cfm.textContent='✓ Jetzt in ChatGPT / Gemini / Claude.ai einfügen!';
  showSnack('Prompt kopiert!','success');
  setTimeout(()=>{
    if(btn) btn.innerHTML='<span class="mi">content_copy</span> Prompt kopieren';
    if(cfm) cfm.textContent='';
  },3000);
}

async function importStory(forceSave=false,forceQueue=false){
  const txt=document.getElementById('import-json').value.trim();
  if(!txt){showSnack('Bitte zuerst das JSON einfügen.','error');return}
  try{
    const res=await fetch('/api/import-story',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({json_text:txt,dry_run:!forceSave,auto_queue:forceQueue})});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');return}
    if(!forceSave&&d.duplicate_check?.is_duplicate){
      const msg=`Ähnliche Story gefunden (${d.duplicate_check.overlap}/10 Keywords).\n\nGefunden: "${d.duplicate_check.similar_story.title}" [${d.duplicate_check.similar_story.code}]\n\nTrotzdem speichern und in Warteschlange?`;
      if(confirm(msg)) importStory(true,true);
      else showSnack('Import abgebrochen.','info');
      return;
    }
    document.getElementById('import-result-title').textContent=d.auto_queued?'Story gespeichert & eingereiht!':'Story importiert!';
    document.getElementById('import-result-body').textContent=`"${d.title}" wurde gespeichert (Code: ${d.code}).`+(d.auto_queued?' Videos werden automatisch erstellt.':'');
    document.getElementById('import-result-actions').innerHTML=`<button class="btn btn--tonal btn--sm" onclick="switchTab('video');pendingSelectStoryId=${d.story_id}"><span class="mi">movie</span> Video-Status</button>`;
    document.getElementById('import-result').classList.add('show');
    showSnack(`"${d.title}" ${d.auto_queued?'wird produziert':'importiert'}!`,'success');
    document.getElementById('import-json').value='';
    loadRecentStories();
  }catch(e){showSnack('Fehler: '+e.message,'error')}
}

function clearImport(){
  document.getElementById('import-json').value='';
  document.getElementById('import-result').classList.remove('show');
}

async function loadRecentStories(){
  const c=document.getElementById('recent-stories-list');
  try{
    const stories=await fetch('/api/stories').then(r=>r.json());
    if(!stories.length){
      c.innerHTML='<div class="empty" style="padding:28px 0"><span class="mi">auto_stories</span><span class="empty__ttl">Noch keine Stories</span></div>';
      return;
    }
    c.innerHTML='';
    stories.slice(0,6).forEach(s=>{
      const el=document.createElement('div');
      el.className='li';
      el.innerHTML=`
        <div class="li__lead"><div class="sdot sdot--ok"></div></div>
        <div class="li__body">
          <div class="li__title">${escHtml(s.title)}</div>
          <div class="li__sub"><span class="badge">${s.code}</span>&nbsp;·&nbsp;${s.total_parts} Teile · ${formatDate(s.created_at)}</div>
        </div>
        <div class="li__trail">
          <button class="btn btn--tonal btn--sm" onclick="event.stopPropagation();switchTab('video');pendingSelectStoryId=${s.id}" title="Zu Videos">
            <span class="mi" style="font-size:16px">movie</span>
          </button>
          <button class="btn btn--icon" style="color:var(--ce)" onclick="event.stopPropagation();deleteRecentStory(${s.id},'${escHtml(s.title).replace(/'/g,"&#39;")}')">
            <span class="mi">delete</span>
          </button>
        </div>`;
      c.appendChild(el);
    });
  }catch(e){c.innerHTML='<div class="empty" style="padding:16px 0"><span class="empty__sub">Fehler beim Laden</span></div>'}
}

async function deleteRecentStory(id,title){
  if(!confirm(`Story "${title}" wirklich löschen?`)) return;
  try{await fetch(`/api/stories/${id}`,{method:'DELETE'});showSnack('Story gelöscht.','success');loadRecentStories()}
  catch(e){showSnack('Fehler.','error')}
}

loadRecentStories();
</script>
