<section class="page" data-tab="upload">
<div class="wrap">

  <div class="page-hdr">
    <div class="page-hdr__ico"><span class="mi">cloud_upload</span></div>
    <div>
      <div class="page-hdr__title">Hintergrundvideos</div>
      <div class="page-hdr__sub">Videos hochladen, die als Hintergrund für Stories verwendet werden</div>
    </div>
  </div>

  <div class="dropzone" id="upload-zone"
    onclick="document.getElementById('file-input').click()"
    ondragover="handleDragOver(event)"
    ondragleave="handleDragLeave()"
    ondrop="handleDrop(event)">
    <span class="mi">cloud_upload</span>
    <div class="dropzone__ttl">Video hierher ziehen oder klicken</div>
    <div class="dropzone__hint">mp4 · mov · avi · max 500 MB</div>
  </div>
  <input type="file" id="file-input" accept=".mp4,.mov,.avi" style="display:none" onchange="uploadFile(this.files[0])">

  <div id="upload-progress-wrap" class="hidden">
    <div class="prow">
      <span style="font-size:13px;color:var(--cosv);flex:0 0 auto;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="upload-filename"></span>
      <div class="pbar"><div class="pbar__fill" id="upload-bar" style="width:0%"></div></div>
      <span style="font-size:13px;font-weight:600;color:var(--cp);min-width:36px;text-align:right" id="upload-percent">0%</span>
    </div>
  </div>

  <div class="lbl"><span class="mi">photo_library</span> Hochgeladen (<span id="bg-count">0</span>)</div>
  <div id="bg-grid" class="bggrid">
    <div class="empty" style="grid-column:1/-1;padding:28px 0">
      <span class="mi">video_library</span>
      <span class="empty__ttl">Keine Hintergrundvideos</span>
    </div>
  </div>

</div>
</section>

<script>
async function loadBackgrounds(){
  const grid=document.getElementById('bg-grid');
  try{
    const bgs=await fetch('/api/backgrounds').then(r=>r.json());
    document.getElementById('bg-count').textContent=bgs.length;
    if(!bgs.length){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1;padding:28px 0"><span class="mi">video_library</span><span class="empty__ttl">Keine Hintergrundvideos</span></div>';
      return;
    }
    grid.innerHTML='';
    bgs.forEach(bg=>{
      const div=document.createElement('div');
      div.className='bgthumb';
      div.innerHTML=`
        <video src="/backgrounds/${bg.filename}" preload="metadata" muted loop></video>
        <div class="bgthumb__ov"><span class="bgthumb__name">${escHtml(bg.filename)}</span></div>
        <button class="bgthumb__del" onclick="event.stopPropagation();deleteBackground('${escHtml(bg.filename)}',this)" title="Löschen">
          <span class="mi">delete</span>
        </button>`;
      const vid=div.querySelector('video');
      div.addEventListener('mouseenter',()=>{vid.play().catch(()=>{})});
      div.addEventListener('mouseleave',()=>{vid.pause();vid.currentTime=0});
      grid.appendChild(div);
    });
  }catch(e){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><span class="empty__sub">Fehler: ${e.message}</span></div>`}
}

function handleDragOver(e){
  e.preventDefault();
  document.getElementById('upload-zone').classList.add('dropzone--on');
}
function handleDragLeave(){
  document.getElementById('upload-zone').classList.remove('dropzone--on');
}
function handleDrop(e){
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('dropzone--on');
  const file=e.dataTransfer?.files?.[0];
  if(file) uploadFile(file);
}

function uploadFile(file){
  if(!file) return;
  const maxMB=500;
  if(file.size>maxMB*1024*1024){showSnack(`Datei zu groß (max ${maxMB} MB)`,'error');return}
  const wrap=document.getElementById('upload-progress-wrap');
  const fnEl=document.getElementById('upload-filename');
  const pctEl=document.getElementById('upload-percent');
  const barEl=document.getElementById('upload-bar');
  wrap.classList.remove('hidden');
  fnEl.textContent=file.name;
  const fd=new FormData();fd.append('video',file);
  const xhr=new XMLHttpRequest();
  xhr.open('POST','/api/backgrounds/upload');
  xhr.upload.onprogress=e=>{
    if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);pctEl.textContent=p+'%';barEl.style.width=p+'%'}
  };
  xhr.onload=()=>{
    wrap.classList.add('hidden');barEl.style.width='0%';
    if(xhr.status===200){showSnack('Upload erfolgreich!','success');loadBackgrounds()}
    else{try{showSnack(JSON.parse(xhr.responseText).error||'Upload fehlgeschlagen','error')}catch{showSnack('Upload fehlgeschlagen','error')}}
    document.getElementById('file-input').value='';
  };
  xhr.onerror=()=>{wrap.classList.add('hidden');showSnack('Netzwerkfehler','error')};
  xhr.send(fd);
}

async function deleteBackground(filename,btn){
  if(!await showConfirm('Hintergrund löschen',`"${filename}" wirklich löschen?`,{confirmLabel:'Löschen',destructive:true}))return;
  btn.closest('.bgthumb').style.opacity='.4';
  try{
    const res=await fetch(`/api/backgrounds/${encodeURIComponent(filename)}`,{method:'DELETE'});
    const d=await res.json();
    if(d.success){showSnack('Gelöscht.','success');loadBackgrounds()}
    else{showSnack(d.error||'Fehler','error');btn.closest('.bgthumb').style.opacity=''}
  }catch(e){showSnack('Fehler: '+e.message,'error');btn.closest('.bgthumb').style.opacity=''}
}
</script>
