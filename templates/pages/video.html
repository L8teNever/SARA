<!-- ============================================================ TAB 2: Video erstellen ============================================================ -->
<section class="tab-content" id="tab-video">
  <div class="page-header">
    <div class="page-header__eyebrow"><span class="material-symbols-rounded">movie</span> Produktion</div>
    <h1 class="page-header__title">Video erstellen</h1>
    <p class="page-header__sub">Wähle eine gespeicherte Story und erstelle automatisch alle Videos.</p>
  </div>

  <div class="d-grid-2">
    <div>
      <div class="md-card md-card--elevated">
        <div class="card-hdr">
          <div class="card-hdr__icon"><span class="material-symbols-rounded">auto_stories</span></div>
          <div class="card-hdr__text">
            <div class="card-title">Story auswählen</div>
            <div class="card-subtitle">Gespeicherte Stories aus der Datenbank</div>
          </div>
        </div>

        <div id="story-list" class="story-select-list">
          <div class="empty-state" style="padding:24px 0">
            <div class="empty-state__icon"><span class="material-symbols-rounded">book</span></div>
            <div class="empty-state__text">Keine Stories vorhanden</div>
          </div>
        </div>

        <div class="md-divider"></div>
        <div class="btn-row">
          <button class="md-btn md-btn--filled" id="btn-create-video" onclick="createVideo()" disabled>
            <span class="material-symbols-rounded">video_settings</span> Videos erstellen
          </button>
          <span class="text-muted" id="selected-story-info"></span>
        </div>
      </div>
    </div>

    <div>
      <div class="md-card md-card--elevated">
        <div class="card-hdr">
          <div class="card-hdr__icon" style="background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)">
            <span class="material-symbols-rounded">queue</span>
          </div>
          <div class="card-hdr__text">
            <div class="card-title">Warteschlange</div>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="card-subtitle" style="margin:0">Echtzeit-Fortschritt</div>
              <span id="sse-status"></span>
            </div>
          </div>
        </div>
        <div id="queue-stats" class="flex-row" style="margin-bottom:12px;gap:6px;"></div>
        <div id="queue-list" class="queue-list">
          <div class="empty-state" style="padding:24px 0">
            <div class="empty-state__icon"><span class="material-symbols-rounded">hourglass_empty</span></div>
            <div class="empty-state__text">Warteschlange ist leer</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
  .story-select-item--done {
    opacity: 0.45;
    filter: saturate(0.5);
  }
  .story-select-item--done:hover {
    opacity: 0.65;
    filter: saturate(0.7);
  }
  .story-select-item--done.selected {
    opacity: 0.75;
    filter: none;
  }
</style>

<script>
  // ============================================================
  //  Story-Liste & Video-Erstellung
  // ============================================================
  async function loadStoryList() {
    const container = document.getElementById('story-list');
    container.innerHTML = '<div class="spinner" style="margin:16px auto"></div>';
    try {
      const stories = await fetch('/api/stories').then(r => r.json());
      if (!stories.length) {
        container.innerHTML = `<div class="empty-state" style="padding:24px 0">
          <div class="empty-state__icon"><span class="material-symbols-rounded">book</span></div>
          <div class="empty-state__text">Keine Stories vorhanden</div>
          <div class="empty-state__hint">Erstelle oder importiere zuerst eine Story</div>
        </div>`;
        return;
      }

      // Aufteilen: noch nicht vollständig produziert vs. alle Videos fertig
      const pending  = stories.filter(s => s.video_done_parts < s.total_parts);
      const finished = stories.filter(s => s.total_parts > 0 && s.video_done_parts >= s.total_parts);

      container.innerHTML = '';

      function renderItem(s, dimmed) {
        const item = document.createElement('div');
        item.className = 'story-select-item'
          + (s.id === selectedStoryId ? ' selected' : '')
          + (dimmed ? ' story-select-item--done' : '');
        item.dataset.id = s.id;

        const progressBadge = dimmed
          ? `<span class="md-chip" style="font-size:11px;padding:2px 8px;gap:4px">
               <span class="material-symbols-rounded" style="font-size:13px;color:var(--md-sys-color-success)">check_circle</span>Fertig
             </span>`
          : (s.video_done_parts > 0
              ? `<span class="md-chip" style="font-size:11px;padding:2px 8px">${s.video_done_parts}/${s.total_parts} Videos</span>`
              : '');

        item.innerHTML = `
          <div class="story-select-item__radio"></div>
          <div class="story-select-item__info">
            <div class="story-select-item__title">[${s.code}] ${escHtml(s.title)}</div>
            <div class="story-select-item__meta"><strong>${s.code}</strong> &middot; ${s.total_parts} Teil(e) &middot; ${formatDate(s.created_at)}</div>
          </div>
          ${progressBadge}
          <button class="md-btn md-btn--icon" style="color:var(--md-sys-color-error);opacity:0.7" 
            onclick="event.stopPropagation(); deleteStoryFromList(${s.id}, '${escHtml(s.title)}')">
            <span class="material-symbols-rounded">delete</span>
          </button>
          <span class="story-code-badge">${s.code}</span>
        `;
        item.addEventListener('click', () => selectStory(s.id, s.title, s.code));
        return item;
      }

      // Ausstehende Stories
      if (pending.length) {
        pending.forEach(s => container.appendChild(renderItem(s, false)));
      }

      // Separator + abgeschlossene Stories
      if (finished.length) {
        const sep = document.createElement('div');
        sep.style.cssText = 'display:flex;align-items:center;gap:8px;margin:14px 0 8px;cursor:pointer;user-select:none;';
        sep.onclick = () => {
          const c = document.getElementById('finished-stories-container');
          const i = document.getElementById('finished-stories-icon');
          const isHidden = c.style.display === 'none';
          c.style.display = isHidden ? 'block' : 'none';
          i.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
          localStorage.setItem('sara_finished_collapsed', !isHidden);
        };

        const isCollapsed = localStorage.getItem('sara_finished_collapsed') === 'true';

        sep.innerHTML = `
          <div style="flex:1;height:1px;background:var(--md-sys-color-outline-variant)"></div>
          <span style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--md-sys-color-on-surface-variant);opacity:.7;white-space:nowrap;display:flex;align-items:center;gap:4px;">
            <span class="material-symbols-rounded" id="finished-stories-icon" style="font-size:16px;transition:transform 0.2s;${isCollapsed ? 'transform:rotate(-90deg)' : ''}">expand_more</span>
            Bereits produziert (${finished.length})
          </span>
          <div style="flex:1;height:1px;background:var(--md-sys-color-outline-variant)"></div>`;
        container.appendChild(sep);

        const fContainer = document.createElement('div');
        fContainer.id = 'finished-stories-container';
        fContainer.style.display = isCollapsed ? 'none' : 'block';
        finished.forEach(s => fContainer.appendChild(renderItem(s, true)));
        container.appendChild(fContainer);
      }

      if (pendingSelectStoryId) {
        const s = stories.find(st => st.id === pendingSelectStoryId);
        if (s) selectStory(s.id, s.title, s.code);
        pendingSelectStoryId = null;
      }
    } catch (e) {
      container.innerHTML = `<div class="text-muted">Fehler: ${e.message}</div>`;
    }
  }

  function selectStory(id, title, code) {
    selectedStoryId = id;
    document.querySelectorAll('.story-select-item').forEach(el =>
      el.classList.toggle('selected', parseInt(el.dataset.id) === id)
    );
    document.getElementById('btn-create-video').disabled = false;
    document.getElementById('selected-story-info').textContent = title ? `"${title}" [${code}]` : '';
  }

  async function createVideo() {
    if (!selectedStoryId) return;
    try {
      const res = await fetch('/api/create-video', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story_id: selectedStoryId })
      });
      const data = await res.json();
      if (data.error) { showSnack(data.error, 'error'); return; }
      showSnack(`${data.job_ids.length} Job(s) hinzugefügt!`, 'success');
      loadQueue();
    } catch (e) {
      showSnack('Fehler: ' + e.message, 'error');
    }
  }

  async function deleteStoryFromList(storyId, title) {
    if (!confirm(`Möchtest du die Story "${title}" und alle zugehörigen Daten wirklich löschen?`)) return;
    try {
      const res = await fetch(`/api/stories/${storyId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.error) { showSnack(data.error, 'error'); return; }
      showSnack('Story gelöscht.', 'success');
      if (selectedStoryId === storyId) {
        selectedStoryId = null;
        document.getElementById('btn-create-video').disabled = true;
        document.getElementById('selected-story-info').textContent = '';
      }
      loadStoryList();
    } catch (e) {
      showSnack('Fehler beim Löschen: ' + e.message, 'error');
    }
  }
</script>
