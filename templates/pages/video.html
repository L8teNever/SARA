<section class="page" data-tab="video">
<div class="wrap">

  <div class="page-hdr">
    <div class="page-hdr__ico"><span class="mi">movie</span></div>
    <div>
      <div class="page-hdr__title">Video produzieren</div>
      <div class="page-hdr__sub">Story auswählen und Videos automatisch erstellen lassen</div>
    </div>
  </div>

  <!-- Production status -->
  <div class="tbox" id="prod-status-bar">
    <span class="mi" id="prod-status-icon" style="font-size:22px">check_circle</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600" id="prod-status-label">Produktion aktiv</div>
      <div style="font-size:12px;opacity:.8" id="prod-status-hint">Videos werden automatisch produziert</div>
    </div>
    <button class="btn btn--outlined btn--sm" id="btn-toggle-prod" onclick="toggleProdStatus()">
      <span class="mi">pause_circle</span> Pausieren
    </button>
  </div>

  <!-- Interval -->
  <div class="card--el" style="margin-bottom:20px">
    <div class="row" style="gap:10px;align-items:center">
      <span class="mi" style="color:var(--cosv);font-size:20px">timer</span>
      <span style="font-size:13px;color:var(--cosv);flex:1">Pause zwischen Videos</span>
      <input type="number" id="prod-interval" class="inp" value="0" min="0"
             style="width:70px;height:36px;font-size:14px;text-align:center">
      <span style="font-size:13px;color:var(--cosv)">Min.</span>
      <button class="btn btn--tonal btn--sm" onclick="saveProdSettings()">
        <span class="mi">save</span> Speichern
      </button>
    </div>
  </div>

  <!-- Story list -->
  <div class="lbl"><span class="mi">auto_stories</span> Verfügbare Stories</div>
  <div id="story-list" class="story-select-grid">
    <div style="display:flex;justify-content:center;padding:32px"><div class="spinner"></div></div>
  </div>

  <!-- Create button -->
  <div style="margin-top:20px;display:flex;flex-direction:column;gap:8px">
    <button class="btn btn--filled btn--lg" id="btn-create-video" onclick="createVideo()" disabled>
      <span class="mi">video_settings</span> <span id="btn-create-video-text">Video-Produktion starten</span>
    </button>
    <div id="selected-story-info" style="font-size:12px;color:var(--cg);text-align:center;min-height:16px;font-weight:500"></div>
  </div>

  <!-- Queue -->
  <div class="lbl" style="margin-top:32px">
    <span class="mi">queue</span> Warteschlange & Status
    <span id="sse-status" style="font-size:11px;text-transform:none;letter-spacing:0;font-weight:400;opacity:.7;margin-left:-4px"></span>
  </div>
  <div id="queue-stats" class="row" style="margin-bottom:12px;padding:0 4px"></div>
  <div id="queue-list">
    <div class="empty"><span class="mi">hourglass_empty</span><span class="empty__ttl">Warteschlange leer</span></div>
  </div>

</div>
</section>

<script>
async function loadStoryList(){
  const c=document.getElementById('story-list');
  try{
    const stories=await fetch('/api/stories').then(r=>r.json());
    if(!stories.length){
      c.innerHTML='<div class="empty"><span class="mi">auto_stories</span><span class="empty__ttl">Keine Stories</span><span class="empty__sub">Importiere zuerst eine Story</span></div>';
      return;
    }
    const done  =stories.filter(s=>s.total_parts>0&&s.video_done_parts>=s.total_parts);
    const queued=stories.filter(s=>s.video_done_parts<s.total_parts&&s.video_queue_parts>0);
    const ready =stories.filter(s=>s.video_done_parts<s.total_parts&&s.video_queue_parts===0);

    let html = '';

    function getStoryItem(s){
      const isDone=s.total_parts>0&&s.video_done_parts>=s.total_parts;
      const isQ=s.video_queue_parts>0;
      let dot=isDone?'sdot sdot--ok':isQ?'sdot sdot--on':'sdot';
      let trail='';
      if(isDone) trail='<span class="chip chip--done">Fertig</span>';
      else if(isQ) trail=`<span class="chip chip--proc">${s.video_queue_parts} aktiv</span>`;
      else if(s.video_done_parts>0) trail=`<span class="chip chip--pend">${s.video_done_parts}/${s.total_parts}</span>`;

      return `
        <div class="li${s.id===selectedStoryId?' is-sel':''}${isDone?' is-dim':''}" data-id="${s.id}" data-title="${escHtml(s.title)}" data-code="${s.code}" onclick="selectStory(this)">
          <div class="li__lead"><div class="${dot}"></div></div>
          <div class="li__body">
            <div class="li__title">${escHtml(s.title)}</div>
            <div class="li__sub"><span class="badge">${s.code}</span>&nbsp;·&nbsp;${s.total_parts} Teile · ${formatDate(s.created_at)}</div>
          </div>
          <div class="li__trail">
            ${trail}
            <button class="btn btn--icon" style="color:var(--ce);opacity:.7" onclick="event.stopPropagation();deleteStoryFromVideo(${s.id},'${escHtml(s.title).replace(/'/g,"&#39;")}',this)">
              <span class="mi">delete</span>
            </button>
          </div>
        </div>`;
    }

    ready.forEach(s=>html += getStoryItem(s));

    if(queued.length){
      html += `<div class="lbl lbl--sm">Wird produziert</div>`;
      queued.forEach(s=>html += getStoryItem(s));
    }
    if(done.length){
      html += `<div class="lbl lbl--sm">Fertig</div>`;
      done.forEach(s=>html += getStoryItem(s));
    }

    c.innerHTML = html;

    if(pendingSelectStoryId){
      const s=stories.find(x=>x.id===pendingSelectStoryId);
      if(s) selectStoryById(s.id,s.title,s.code);
      pendingSelectStoryId=null;
    } else if(selectedStoryId) {
      selectStoryById(selectedStoryId);
    }
  }catch(e){c.innerHTML=`<div class="empty"><span class="empty__sub">Fehler: ${e.message}</span></div>`}
}

function selectStory(el){
  const id = parseInt(el.dataset.id);
  const title = el.dataset.title;
  const code = el.dataset.code;
  selectStoryById(id, title, code);
}

function selectStoryById(id, title='', code=''){
  selectedStoryId=id;
  document.querySelectorAll('.li[data-id]').forEach(el=>{
    const isSel = parseInt(el.dataset.id)===id;
    el.classList.toggle('is-sel', isSel);
    if(isSel && !title) {
        title = el.dataset.title;
    }
  });
  document.getElementById('btn-create-video').disabled=false;
  document.getElementById('selected-story-info').textContent=title?`"${title}" ausgewählt`:'';
}

async function createVideo(){
  if(!selectedStoryId) return;
  const btn = document.getElementById('btn-create-video');

  btn.disabled = true;
  const oldHtml = btn.innerHTML;
  btn.innerHTML = '<div class="spinner spinner--sm" style="margin-right:8px;border-width:2px;width:18px;height:18px"></div> Verarbeite...';

  try{
    const res=await fetch('/api/create-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({story_id:selectedStoryId})});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');return}
    showSnack(`${d.job_ids.length} Teil(e) zur Warteschlange hinzugefügt!`,'success');
    loadQueue();
    setTimeout(loadStoryList, 500);
  }catch(e){
    showSnack('Fehler: '+e.message,'error');
  } finally {
    btn.innerHTML = oldHtml;
    btn.disabled = false;
  }
}

async function deleteStoryFromVideo(id,title,btn){
  if(!await showConfirm('Story löschen',`"${title}" und alle zugehörigen Daten löschen?`,{confirmLabel:'Löschen',destructive:true}))return;
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spinner spinner--sm" style="width:14px;height:14px;border-width:2px"></div>'}
  try{
    const res=await fetch(`/api/stories/${id}`,{method:'DELETE'});
    const d=await res.json();
    if(d.error){showSnack(d.error,'error');if(btn){btn.disabled=false;btn.innerHTML='<span class="mi">delete</span>'}return}
    showSnack('Story gelöscht.','success');
    if(selectedStoryId===id){
      selectedStoryId=null;
      document.getElementById('btn-create-video').disabled=true;
      document.getElementById('selected-story-info').textContent='';
    }
    loadStoryList();
  }catch(e){showSnack('Fehler: '+e.message,'error');if(btn){btn.disabled=false;btn.innerHTML='<span class="mi">delete</span>'}}
}

async function loadProdSettings(){
  try{
    const s=await fetch('/api/settings').then(r=>r.json());
    if(s.prod_interval_min!==undefined) document.getElementById('prod-interval').value=s.prod_interval_min;
    _prodActive=s.prod_active!=='0';
    updateProdBtn();
  }catch(_){}
}

function updateProdBtn(){
  const btn=document.getElementById('btn-toggle-prod');
  const icon=document.getElementById('prod-status-icon');
  const lbl=document.getElementById('prod-status-label');
  const hint=document.getElementById('prod-status-hint');
  const box=document.getElementById('prod-status-bar');
  if(_prodActive){
    box.className='tbox';
    btn.className='btn btn--outlined btn--sm';
    btn.removeAttribute('style');
    btn.innerHTML='<span class="mi">pause_circle</span> Pausieren';
    if(icon){icon.textContent='check_circle';icon.style.color=''}
    if(lbl) lbl.textContent='Produktion aktiv';
    if(hint) hint.textContent='Videos werden automatisch produziert';
  }else{
    box.className='tbox tbox--warn';
    btn.className='btn btn--sm';
    btn.style.cssText='background:var(--cw);color:#1C1B1F;font-weight:600';
    btn.innerHTML='<span class="mi">play_circle</span> Fortsetzen';
    if(icon){icon.textContent='pause_circle';icon.style.color='var(--cw)'}
    if(lbl) lbl.textContent='Produktion pausiert';
    if(hint) hint.textContent='Klicke Fortsetzen um die Queue zu starten';
  }
}

async function toggleProdStatus(){
  const oldActive = _prodActive;
  _prodActive=!_prodActive;
  updateProdBtn();
  try{
    const res = await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prod_active:_prodActive?'1':'0'})});
    if(!res.ok) throw new Error();
    showSnack(_prodActive?'Produktion gestartet':'Produktion pausiert','success');
  }catch(e){
    _prodActive = oldActive;
    updateProdBtn();
    showSnack('Fehler beim Ändern des Status','error');
  }
}

async function saveProdSettings(){
  const val=document.getElementById('prod-interval').value;
  try{
    const res=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prod_interval_min:val})});
    const d=await res.json();
    if(d.success) showSnack('Intervall gespeichert!','success');
  }catch(e){showSnack('Fehler','error')}
}
</script>
