<section class="page" data-tab="video">

  <!-- Main -->
  <div id="video-main">
    <div class="wrap">

      <!-- Queue -->
      <div class="lbl" style="margin-top:4px">
        <span class="mi">bolt</span> Aktuell in Produktion &amp; Warteschlange
        <span id="sse-status" style="font-size:11px;text-transform:none;letter-spacing:0;font-weight:400;opacity:.7;margin-left:-4px"></span>
      </div>
      <div id="queue-stats" class="row" style="margin-bottom:12px;padding:0 4px"></div>
      <div id="queue-list">
        <div class="empty"><span class="mi">hourglass_empty</span><span class="empty__ttl">Warteschlange leer</span></div>
      </div>

    </div>
  </div>

  <!-- Einstellungen -->
  <div id="video-settings" style="display:none">
    <div class="wrap">

      <!-- Production status -->
      <div class="tbox" id="prod-status-bar">
        <span class="mi" id="prod-status-icon" style="font-size:22px">check_circle</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:700" id="prod-status-label">Produktion aktiv</div>
          <div style="font-size:12px;opacity:.8" id="prod-status-hint">Videos werden automatisch produziert</div>
        </div>
        <button class="btn btn--outlined btn--sm" id="btn-toggle-prod" onclick="toggleProdStatus()">
          <span class="mi">pause_circle</span> Pausieren
        </button>
      </div>

      <!-- Interval -->
      <div class="card--el">
        <div class="field" style="margin-bottom:0">
          <label class="flabel" for="prod-interval">
            <span class="mi" style="font-size:13px;vertical-align:-2px;margin-right:2px">timer</span>Pause zwischen Videos (Minuten)
          </label>
          <div class="row" style="gap:10px;flex-wrap:nowrap">
            <input type="number" id="prod-interval" class="inp" value="0" min="0" style="flex:1;min-width:0;text-align:center">
            <button class="btn btn--tonal" style="flex-shrink:0" onclick="saveProdSettings()">
              <span class="mi">save</span> Speichern
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

</section>

<script>
function openVideoSettings(push=true){
  document.getElementById('video-main').style.display='none';
  document.getElementById('video-settings').style.display='block';
  if(push) history.pushState({tab:'video',view:'settings'},'','/video/einstellungen');
  enterSubpage('Einstellungen', closeVideoSettings);
}
function closeVideoSettings(push=true){
  document.getElementById('video-settings').style.display='none';
  document.getElementById('video-main').style.display='block';
  if(push) history.pushState({tab:'video'},'','/video');
  exitSubpage();
}

async function loadProdSettings(){
  try{
    const s=await fetch('/api/settings').then(r=>r.json());
    if(s.prod_interval_min!==undefined) document.getElementById('prod-interval').value=s.prod_interval_min;
    _prodActive=s.prod_active!=='0';
    updateProdBtn();
  }catch(_){}
}

function updateProdBtn(){
  const btn=document.getElementById('btn-toggle-prod');
  const icon=document.getElementById('prod-status-icon');
  const lbl=document.getElementById('prod-status-label');
  const hint=document.getElementById('prod-status-hint');
  const box=document.getElementById('prod-status-bar');
  if(_prodActive){
    box.className='tbox';
    btn.className='btn btn--outlined btn--sm';
    btn.removeAttribute('style');
    btn.innerHTML='<span class="mi">pause_circle</span> Pausieren';
    if(icon){icon.textContent='check_circle';icon.style.color=''}
    if(lbl) lbl.textContent='Produktion aktiv';
    if(hint) hint.textContent='Videos werden automatisch produziert';
  }else{
    box.className='tbox tbox--warn';
    btn.className='btn btn--sm';
    btn.style.cssText='background:var(--cw);color:#1C1B1F;font-weight:700';
    btn.innerHTML='<span class="mi">play_circle</span> Fortsetzen';
    if(icon){icon.textContent='pause_circle';icon.style.color='var(--cw)'}
    if(lbl) lbl.textContent='Produktion pausiert';
    if(hint) hint.textContent='Klicke Fortsetzen um die Queue zu starten';
  }
}

async function toggleProdStatus(){
  const oldActive = _prodActive;
  _prodActive=!_prodActive;
  updateProdBtn();
  try{
    const res = await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prod_active:_prodActive?'1':'0'})});
    if(!res.ok) throw new Error();
    showSnack(_prodActive?'Produktion gestartet':'Produktion pausiert','success');
  }catch(e){
    _prodActive = oldActive;
    updateProdBtn();
    showSnack('Fehler beim Ändern des Status','error');
  }
}

async function saveProdSettings(){
  const val=document.getElementById('prod-interval').value;
  try{
    const res=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prod_interval_min:val})});
    const d=await res.json();
    if(d.success) showSnack('Intervall gespeichert!','success');
  }catch(e){showSnack('Fehler','error')}
}
</script>
